/* ══════════ TOKENS ══════════ */
:root{
  --paper:#EFEDE6;
  --paper-2:#FBFAF7;
  --paper-3:#E7E4DB;
  --ink:#14161B;
  --ink-2:#454B57;
  --ink-3:#767E8C;
  --cobalt:#1B3A8F;
  --cobalt-2:#2A52C4;
  --cobalt-bg:#E7ECFA;
  --marker:#E4FF4A;
  --good:#0E6B4F;
  --good-bg:#E2F3EA;
  --bad:#AE2118;
  --bad-bg:#FBE9E6;
  --amber:#8A5A00;
  --amber-bg:#FCEDCE;
  --line:rgba(20,22,27,.13);
  --line-2:rgba(20,22,27,.07);
  --shadow-s:0 1px 1px rgba(20,22,27,.04),0 2px 6px -3px rgba(20,22,27,.12);
  --shadow-m:0 1px 2px rgba(20,22,27,.05),0 10px 26px -16px rgba(20,22,27,.30);
  --shadow-l:0 2px 4px rgba(20,22,27,.04),0 26px 60px -34px rgba(20,22,27,.40);
  --r-s:8px; --r-m:14px; --r-l:22px;
  --f-display:"Fraunces","Iowan Old Style",Georgia,"Times New Roman",serif;
  --f-text:"IBM Plex Sans","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --s0:clamp(.95rem,.92rem + .18vw,1.03rem);
  --s1:clamp(1.08rem,1rem + .4vw,1.25rem);
  --s2:clamp(1.35rem,1.15rem + 1vw,1.85rem);
  --s3:clamp(1.75rem,1.4rem + 1.9vw,2.9rem);
  --s4:clamp(2.3rem,1.6rem + 3.6vw,4.4rem);
  --gap:clamp(.85rem,.6rem + 1vw,1.4rem);
  --pad:clamp(1rem,.7rem + 1.6vw,2.4rem);
  --maxw:1220px;
}
[data-theme="dark"]{
  --paper:#101218;
  --paper-2:#171A21;
  --paper-3:#1E222B;
  --ink:#EDEFF3;
  --ink-2:#AEB5C2;
  --ink-3:#7E8797;
  --cobalt:#9DB6FF;
  --cobalt-2:#BCCBFF;
  --cobalt-bg:#1C2540;
  --marker:#D7F23F;
  --good:#6EE0AC;
  --good-bg:#12291F;
  --bad:#FF9C91;
  --bad-bg:#2C1815;
  --amber:#F4C765;
  --amber-bg:#2A2214;
  --line:rgba(237,239,243,.16);
  --line-2:rgba(237,239,243,.09);
  --shadow-s:0 1px 2px rgba(0,0,0,.5);
  --shadow-m:0 2px 6px rgba(0,0,0,.45),0 16px 34px -22px rgba(0,0,0,.8);
  --shadow-l:0 4px 10px rgba(0,0,0,.4),0 34px 70px -40px rgba(0,0,0,.9);
}
/* ══════════ BASE ══════════ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-text);font-size:var(--s0);line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(var(--line-2) .7px,transparent .7px);
  background-size:22px 22px;
}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.08;letter-spacing:-.02em;margin:0}
p{margin:0 0 .85em}
a{color:var(--cobalt);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
b,strong{font-weight:600;color:var(--ink)}
i,em{font-style:italic}
s{text-decoration-thickness:1.5px}
::selection{background:var(--marker);color:#14161B}
:focus-visible{outline:2.5px solid var(--cobalt-2);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
hr{border:0;border-top:1px solid var(--line);margin:1.6rem 0}
/* ══════════ CHROME ══════════ */
.topbar{
  position:sticky;top:0;z-index:60;background:color-mix(in oklab,var(--paper) 88%,transparent);
  backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:var(--maxw);margin:0 auto;padding:.6rem var(--pad);
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:.65rem;cursor:pointer;background:none;padding:.15rem;border-radius:10px}
.brand:hover{background:var(--paper-3)}
.brand-mark{
  width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--paper-2);
  display:grid;place-items:center;font-family:var(--f-display);font-size:1.45rem;line-height:1;
  box-shadow:var(--shadow-s);flex:none;
}
[data-theme="dark"] .brand-mark{background:var(--marker);color:#14161B}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.brand-txt b{font-family:var(--f-display);font-size:1.02rem;letter-spacing:-.01em}
.brand-txt span{font-family:var(--f-mono);font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.nav{display:flex;gap:.2rem;margin-left:auto;flex-wrap:wrap}
.navbtn{
  padding:.42rem .78rem;border-radius:999px;font-size:.86rem;font-weight:500;color:var(--ink-2);
  border:1px solid transparent;transition:background .16s,color .16s,border-color .16s;
}
.navbtn:hover{background:var(--paper-3);color:var(--ink);text-decoration:none}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
[data-theme="dark"] .navbtn[aria-current="page"]{background:var(--marker);color:#14161B;border-color:var(--marker)}
.iconbtn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;
  background:var(--paper-2);color:var(--ink-2);flex:none;
}
.iconbtn:hover{background:var(--paper-3);color:var(--ink)}
/* ══════════ SHELL ══════════ */
.main{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:clamp(1rem,.6rem + 2vw,2.2rem) var(--pad) 4rem}
.wrap-narrow{max-width:760px}
/* ══════════ HOME / HERO ══════════ */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(1.2rem,3vw,3rem);align-items:center;padding:clamp(1rem,2vw,2.2rem) 0 clamp(1.6rem,3vw,3rem)}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5rem;font-family:var(--f-mono);font-size:.68rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin-bottom:1rem;
}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--cobalt);display:block}
h1.hero-title{font-size:var(--s4);letter-spacing:-.035em;margin:0 0 .8rem;font-weight:600}
h1.hero-title em{
  font-style:normal;background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 92%,transparent 92%);
  padding:0 .08em;
}
.hero-lead{font-size:var(--s1);color:var(--ink-2);max-width:44ch;margin-bottom:1.4rem}
.cta-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.68rem 1.15rem;
  border-radius:999px;font-weight:600;font-size:.92rem;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper-2);transition:transform .14s,box-shadow .16s,background .16s;
  box-shadow:var(--shadow-s);
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-m);text-decoration:none}
.btn.ghost{background:var(--paper-2);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--paper-3)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
[data-theme="dark"] .btn.primary{color:#0F1218}
.btn.sm{padding:.42rem .8rem;font-size:.82rem}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* specimen card (signature) */
.specimen{
  position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-l);
  padding:1.4rem 1.4rem 1.1rem;box-shadow:var(--shadow-l);overflow:hidden;
}
.specimen::after{
  content:"";position:absolute;inset:auto -30% -60% auto;width:70%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,color-mix(in oklab,var(--cobalt) 14%,transparent),transparent 68%);
}
.spec-label{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:.6rem;margin-bottom:1rem}
.spec-word{
  font-family:var(--f-display);font-size:clamp(2.6rem,7vw,3.6rem);line-height:1;letter-spacing:-.02em;
  margin:.2rem 0 .35rem;transition:opacity .25s;
}
.spec-word .tk{color:var(--cobalt);position:relative}
.spec-meta{font-size:.86rem;color:var(--ink-2);min-height:2.9em;transition:opacity .25s}
.spec-meta .rule{display:block;color:var(--ink);font-weight:600;margin-bottom:.15rem}
.spec-dots{display:flex;gap:.3rem;margin-top:.9rem}
.spec-dots button{width:22px;height:4px;border-radius:2px;background:var(--line);padding:0}
.spec-dots button[aria-current="true"]{background:var(--cobalt)}
/* stats */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin:clamp(1.4rem,3vw,2.4rem) 0}
@media(max-width:720px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--paper-2);padding:1rem .95rem}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1;letter-spacing:-.02em}
.stat span{font-size:.74rem;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
/* cards */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
@media(max-width:900px){.grid-3{grid-template-columns:1fr}}
.card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-m);padding:1.2rem;
  box-shadow:var(--shadow-s);position:relative;display:flex;flex-direction:column;gap:.45rem;
}
.card.link{cursor:pointer;transition:transform .16s,box-shadow .18s,border-color .18s;text-align:left}
.card.link:hover{transform:translateY(-2px);box-shadow:var(--shadow-m);border-color:color-mix(in oklab,var(--cobalt) 40%,var(--line));text-decoration:none}
.card h3{font-size:1.12rem;letter-spacing:-.01em}
.card p{color:var(--ink-2);font-size:.92rem;margin:0}
.card .num{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;color:var(--cobalt);text-transform:uppercase}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:clamp(1.8rem,4vw,3rem) 0 1rem;border-top:1px solid var(--line);padding-top:1rem}
.sect h2{font-size:var(--s2)}
.sect span{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
/* ══════════ THEORY LAYOUT ══════════ */
.theory{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(1.2rem,3vw,2.6rem);align-items:start}
@media(max-width:940px){.theory{grid-template-columns:1fr}}
.rail{position:sticky;top:74px;max-height:calc(100vh - 92px);overflow:auto;padding-right:.4rem}
@media(max-width:940px){.rail{position:static;max-height:none;overflow:visible}}
.rail-search{position:relative;margin-bottom:.9rem}
.rail-search input{
  width:100%;padding:.5rem .7rem .5rem 2rem;border-radius:10px;border:1px solid var(--line);
  background:var(--paper-2);color:var(--ink);font:inherit;font-size:.86rem;
}
.rail-search svg{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);color:var(--ink-3);width:14px;height:14px}
.rail-group{margin-bottom:1.1rem}
.rail-group>p{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 .35rem;padding-left:.55rem}
.rail-link{
  display:flex;gap:.5rem;align-items:center;padding:.34rem .55rem;border-radius:8px;font-size:.855rem;
  color:var(--ink-2);line-height:1.3;border-left:2px solid transparent;
}
.rail-link:hover{background:var(--paper-3);color:var(--ink);text-decoration:none}
.rail-link[aria-current="true"]{background:var(--cobalt-bg);color:var(--ink);border-left-color:var(--cobalt);font-weight:600}
.rail-link .dot{width:5px;height:5px;border-radius:50%;background:var(--line);flex:none;margin-top:.45em}
.rail-link[aria-current="true"] .dot{background:var(--cobalt)}
.rail-link.done .dot{background:var(--good)}
/* lesson */
.lesson{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-l);padding:clamp(1.1rem,2.4vw,2.3rem);box-shadow:var(--shadow-m);margin-bottom:1.6rem;scroll-margin-top:88px}
.lesson.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 4px color-mix(in oklab,var(--cobalt) 45%,transparent)}100%{box-shadow:var(--shadow-m)}}
.lesson-head{margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.kicker{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:var(--cobalt);margin-bottom:.5rem}
.kicker::before{content:"á";font-family:var(--f-display);font-size:.95rem;line-height:1;color:var(--cobalt);transform:translateY(-1px)}
.lesson h2{font-size:var(--s2);letter-spacing:-.025em}
.lesson-body{max-width:70ch;color:var(--ink)}
.lesson-body>p{font-size:1rem}
.lesson-body .regla{
  font-size:1.02rem;background:linear-gradient(transparent 60%,color-mix(in oklab,var(--marker) 72%,transparent) 60%,color-mix(in oklab,var(--marker) 72%,transparent) 95%,transparent 95%);
  padding:.1rem .1rem .2rem;display:block;
}
[data-theme="dark"] .lesson-body .regla{background:none;border-left:3px solid var(--marker);padding-left:.8rem}
.nota{font-size:.9rem !important;color:var(--ink-2);border-left:2px solid var(--line);padding-left:.8rem;margin-top:1rem !important}
.tw{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--paper-2)}
.tabla{border-collapse:collapse;width:100%;font-size:.875rem;min-width:min(100%,440px)}
.tabla th{
  text-align:left;font-family:var(--f-mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:.55rem .8rem;background:var(--paper-3);border-bottom:1px solid var(--line);white-space:nowrap;
}
.tabla td{padding:.55rem .8rem;border-bottom:1px solid var(--line-2);vertical-align:top}
.tabla tr:last-child td{border-bottom:0}
.tabla tbody tr:hover{background:color-mix(in oklab,var(--cobalt) 4%,transparent)}
.trampa{
  margin:1.1rem 0;padding:.85rem 1rem;background:var(--amber-bg);border-radius:var(--r-m);
  border-left:3px solid var(--amber);font-size:.9rem;color:var(--ink);
}
.trampa .tag{
  display:inline-block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--amber);font-weight:600;margin-bottom:.35rem;
}
.examples{display:grid;gap:.5rem;margin:1rem 0}
.ex{padding:.6rem .85rem;border-radius:10px;font-size:.9rem;border:1px solid var(--line);background:var(--paper)}
.ex.ok{border-color:color-mix(in oklab,var(--good) 30%,var(--line));background:var(--good-bg)}
.ex.bad{border-color:color-mix(in oklab,var(--bad) 26%,var(--line));background:var(--bad-bg)}
.ex b{font-weight:600}
.ex s{color:var(--bad);text-decoration-color:color-mix(in oklab,var(--bad) 60%,transparent)}
.lesson-foot{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line)}
.lesson-foot .spacer{flex:1}
.tag-mini{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
/* ══════════ TEST SETUP ══════════ */
.panel{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-l);padding:clamp(1.1rem,2.4vw,2rem);box-shadow:var(--shadow-m)}
.panel h2{font-size:var(--s2);margin-bottom:.3rem}
.panel .sub{color:var(--ink-2);font-size:.94rem;margin-bottom:1.4rem}
.field{margin-bottom:1.3rem}
.field>label{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.5rem}
.chips{display:flex;gap:.45rem;flex-wrap:wrap}
.chip{
  padding:.5rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  font-size:.87rem;font-weight:500;color:var(--ink-2);transition:all .15s;
}
.chip:hover{border-color:var(--cobalt);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--marker);color:#14161B;border-color:var(--marker)}
/* ══════════ RUNNER ══════════ */
.runner{max-width:840px;margin:0 auto}
.hud{display:flex;align-items:center;gap:1rem;margin-bottom:.9rem;font-size:.8rem;color:var(--ink-2);font-family:var(--f-mono);letter-spacing:.06em}
.hud .spacer{flex:1}
.hud b{color:var(--ink);font-family:var(--f-text);font-size:.9rem;font-weight:600;letter-spacing:0}
.pbar{height:6px;border-radius:3px;background:var(--paper-3);overflow:hidden;margin-bottom:1.4rem;border:1px solid var(--line-2)}
.pbar>i{display:block;height:100%;background:var(--cobalt);transition:width .3s ease}
.q-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-l);padding:clamp(1.1rem,2.6vw,1.9rem);box-shadow:var(--shadow-m)}
.q-tag{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt);margin-bottom:.7rem}
.q-tag::before{content:"";width:16px;height:2px;background:var(--cobalt)}
.q-prompt{font-size:1.12rem;font-weight:600;line-height:1.35;margin-bottom:1.1rem;letter-spacing:-.01em}
.q-word{
  display:inline-block;font-family:var(--f-mono);font-size:1.5rem;letter-spacing:.02em;
  padding:.12em .4em;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  margin:.1rem .15rem .1rem 0;
}
.q-sent{font-size:1.06rem;line-height:1.6}
.opts{display:grid;gap:.55rem}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:640px){.opts.two{grid-template-columns:1fr}}
.opt{
  display:flex;align-items:center;gap:.7rem;text-align:left;width:100%;padding:.78rem .95rem;
  border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:1rem;
  transition:border-color .14s,background .14s,transform .1s;
}
.opt:hover:not(.locked){border-color:var(--cobalt);background:var(--cobalt-bg);transform:translateX(2px)}
.opt .k{
  width:23px;height:23px;flex:none;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);background:var(--paper-2);
}
.opt .v{flex:1;font-family:var(--f-mono);font-size:.98rem}
.opt.sent .v{font-family:var(--f-text);font-size:.98rem;line-height:1.45}
.opt.locked{cursor:default}
.opt.is-correct{border-color:var(--good);background:var(--good-bg)}
.opt.is-correct .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-dim{opacity:.5}
.fb{margin-top:1.1rem;border-radius:var(--r-m);padding:1rem 1.1rem;font-size:.92rem;border:1px solid var(--line);background:var(--paper)}
.fb.good{border-color:color-mix(in oklab,var(--good) 34%,var(--line));background:var(--good-bg)}
.fb.bad{border-color:color-mix(in oklab,var(--bad) 30%,var(--line));background:var(--bad-bg)}
.fb-head{display:flex;align-items:center;gap:.5rem;font-weight:700;margin-bottom:.45rem;font-size:.95rem}
.fb.good .fb-head{color:var(--good)}
.fb.bad .fb-head{color:var(--bad)}
.fb-head .ico{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.72rem;flex:none}
.fb.good .ico{background:var(--good)} .fb.bad .ico{background:var(--bad)}
.fb-why{color:var(--ink);line-height:1.55}
.fb-read{margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.85rem;color:var(--ink-2)}
.fb-read .lbl{font-family:var(--f-mono);font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.runner-foot{display:flex;gap:.6rem;margin-top:1.1rem;align-items:center;flex-wrap:wrap}
.runner-foot .spacer{flex:1}
.hint{font-size:.78rem;color:var(--ink-3);font-family:var(--f-mono)}
kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:.05em .35em;background:var(--paper-2);color:var(--ink-2)}
/* ══════════ RESULTS ══════════ */
.score-wrap{display:flex;gap:clamp(1rem,3vw,2.4rem);align-items:center;flex-wrap:wrap;margin-bottom:1.4rem}
.ring{--pct:0;width:118px;height:118px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;background:conic-gradient(var(--cobalt) calc(var(--pct)*1%),var(--paper-3) 0)}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--paper-2)}
.ring span{position:relative;font-family:var(--f-display);font-size:1.75rem;letter-spacing:-.03em}
.ring small{position:relative;display:block;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:center;margin-top:-.15rem}
.score-txt h2{font-size:var(--s2);margin-bottom:.3rem}
.score-txt p{color:var(--ink-2);margin:0;font-size:.95rem}
.review{margin-top:1.6rem;display:grid;gap:.7rem}
.rev-item{border:1px solid var(--line);border-radius:var(--r-m);padding:.9rem 1rem;background:var(--paper-2)}
.rev-item .rq{font-weight:600;font-size:.95rem;margin-bottom:.35rem}
.rev-item .ra{font-size:.88rem;color:var(--ink-2);margin-bottom:.4rem}
.rev-item .ra b{color:var(--good)}
.rev-item .rw{font-size:.88rem;color:var(--ink-2);border-top:1px solid var(--line-2);padding-top:.5rem;margin-top:.5rem}
/* ══════════ PROGRESS ══════════ */
.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:1.6rem}
@media(max-width:720px){.metric{grid-template-columns:1fr}}
.bars{display:grid;gap:.9rem}
.bar-row{display:grid;grid-template-columns:minmax(120px,1.4fr) 1fr auto;gap:.8rem;align-items:center;font-size:.88rem}
.bar-track{height:8px;border-radius:4px;background:var(--paper-3);overflow:hidden;border:1px solid var(--line-2)}
.bar-track>i{display:block;height:100%;background:var(--cobalt);border-radius:4px}
.bar-track>i.low{background:var(--bad)} .bar-track>i.mid{background:var(--amber)}
.bar-row .pct{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);min-width:3.2em;text-align:right}
.weak-list{display:grid;gap:.5rem;margin-top:.6rem}
.weak-item{display:flex;gap:.6rem;align-items:center;border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;background:var(--paper);font-size:.88rem}
.weak-item .wl{flex:1}
.weak-item .wp{font-family:var(--f-mono);font-size:.74rem;color:var(--bad)}
.empty{color:var(--ink-3);font-size:.9rem;padding:1rem;border:1px dashed var(--line);border-radius:12px;text-align:center}
/* ══════════ MISC ══════════ */
.footer{border-top:1px solid var(--line);margin-top:3rem;padding:1.6rem 0 0;color:var(--ink-3);font-size:.8rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.toast{
  position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,140%);background:var(--ink);color:var(--paper-2);
  padding:.6rem 1.1rem;border-radius:999px;font-size:.86rem;box-shadow:var(--shadow-l);z-index:100;transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:90vw;
}
.toast.show{transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media print{
  body{background:#fff}
  .topbar,.rail,.no-print,.footer,.runner-foot,.opts,.toast{display:none !important}
  .lesson,.panel,.q-card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .theory{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}

/* ══════════ MOBILE OPTIMIZATIONS ══════════ */

/* Touch-friendly base */
@media (max-width: 768px) {

    --pad: .9rem;

    --r-m: 12px;

    margin-left: 0;
    padding: .1rem 0;
  }

  .nav::-webkit-scrollbar {
    display: none;
  }

  .navbtn {
    padding: .35rem .6rem;
    font-size: .8rem;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .iconbtn {
    width: 32px;
    height: 32px;

    gap: 1.5rem;

    margin-bottom: .6rem;
  }

  .hero-lead {
    font-size: 1rem;
    margin-bottom: 1rem;
  }

  .eyebrow {
    font-size: .6rem;
    margin-bottom: .7rem;
  }

  /* Specimen card */
  .specimen {
    padding: 1rem;
    border-radius: var(--r-m);
  }

  .spec-word {
    font-size: clamp(2rem, 10vw, 2.8rem);
  }

  .spec-meta {
    font-size: .82rem;
    min-height: auto;
  }

  /* Stats */
  .stat-row {
    grid-template-columns: repeat(2, 1fr);
    margin: 1rem 0;
  }

  .stat {
    padding: .8rem .6rem;
  }

  .stat b {
    font-size: 1.3rem;
  }

  .stat span {
    font-size: .65rem;
  }

  /* Grid de cards */
  .grid-3 {
    grid-template-columns: 1fr;
    gap: .8rem;
  }

  .card {
    padding: 1rem;
  }

  .card h3 {
    font-size: 1.05rem;
  }

  .card p {
    font-size: .88rem;
  }

  /* Sección headers */
  .sect {
    margin: 1.4rem 0 .8rem;
    padding-top: .8rem;
  }

  .sect h2 {
    font-size: var(--s1);
  }

  /* Theory layout */
  .theory {
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .rail {
    position: static;
    max-height: 55vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: .6rem;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: var(--r-m);
    margin-bottom: .5rem;
  }

  .rail-group {
    margin-bottom: .8rem;
  }

  .rail-link {
    padding: .4rem .5rem;
    font-size: .82rem;
  }

  /* Lesson */
  .lesson {
    padding: 1rem;
    border-radius: var(--r-m);
    scroll-margin-top: 70px;
  }

  .lesson h2 {
    font-size: 1.3rem;
  }

    max-width: 100%;
  }

    font-size: .95rem;
  }

  .lesson-body .regla {
    font-size: .95rem;
  }

  }

  .lesson-foot .btn {
    width: 100%;
    justify-content: center;
  }

  .lesson-foot .spacer {
    display: none;
  }

  /* Tablas scrollables */
  .tw {
    margin: .8rem -.5rem;
    width: calc(100% + 1rem);
    border-radius: 0;
    border-left: 0;
    border-right: 0;
  }

  .tabla {
    font-size: .82rem;
  }

  .tabla th,
  .tabla td {

    padding: .7rem .85rem;
    font-size: .85rem;
    margin: .8rem 0;
  }

  .examples {
    margin: .8rem 0;
  }

  .ex {
    padding: .5rem .7rem;
    font-size: .85rem;
  }

  /* Test setup panel */
  .panel {
    padding: 1rem;
    border-radius: var(--r-m);
  }

  .panel h2 {
    font-size: 1.3rem;
  }

  .panel .sub {
    font-size: .88rem;
  }

  .field {
    margin-bottom: 1rem;
  }

  .chips {
    gap: .35rem;
  }

  .chip {
    padding: .45rem .7rem;
    font-size: .82rem;
  }

  .cta-row {
    flex-direction: column;
    gap: .5rem;
  }

  .cta-row .btn {
    width: 100%;

  /* Runner / Test */
  .runner {

    gap: .5rem;

  .hud b {

  }

    font-size: 1.2rem;
    padding: .1em .3em;
  }

  .opts.two {
    grid-template-columns: 1fr;
  }

    padding: .85rem .8rem;
    min-height: 48px; /* Touch target */

  }

  .opt .k {

    height: 28px;

  }

  .opt .v {
    font-size: .92rem;
  }

    font-size: .88rem;

    padding: .85rem;
    font-size: .88rem;

  .fb-head {
    font-size: .9rem;

    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1rem;
  }

  .ring {
    width: 100px;
    height: 100px;
  }

  .ring span {
    font-size: 1.5rem;
  }

  .score-txt h2 {
    font-size: 1.3rem;
  }

  .score-txt p {
    font-size: .88rem;
  }

  .review {
    margin-top: 1.2rem;

  .rev-item {

  .rev-item .rq {
    font-size: .9rem;

  .rev-item .ra,

  /* Progress */
  .metric {
    grid-template-columns: 1fr;
    gap: .6rem;
    margin-bottom: 1.2rem;
  }

  .bars {
    gap: .7rem;
  }

  .bar-row {
    grid-template-columns: 1fr;

  }

  .bar-row span:first-child {
    font-size: .85rem;
  }

  .bar-track {
    height: 7px;
  }

  .bar-row .pct {
    font-size: .75rem;
  }

  .weak-item {
    flex-direction: column;
    align-items: flex-start;

    padding: .7rem;
  }

  .weak-item .wl {
    font-size: .85rem;
  }

  .weak-item .wp {
    font-size: .75rem;
  }

  .weak-item .btn {
    align-self: stretch;
    justify-content: center;
  }

  /* Footer */
  .footer {
    flex-direction: column;
    text-align: center;
    gap: .5rem;

  /* Toast */

/* Extra small screens */
@media (max-width: 380px) {
  .stat-row {

  }

  .navbtn {

    font-size: .75rem;
  }

  .btn {
    padding: .6rem 1rem;

  }

  }

/* Landscape phones */
@media (max-height: 500px) and (orientation: landscape) {
  .hero {
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

    max-height: 45vh;
  }
}

/* Improve touch targets globally */
@media (pointer: coarse) {
  .navbtn,
  .chip,
  .btn,
  .opt,
  .rail-link,
  .iconbtn {
    min-height: 44px;
  }

    min-width: 28px;

/* Safe area for notched phones */
@supports (padding: max(0px)) {
  .topbar-in,
  .main {
    padding-left: max(var(--pad), env(safe-area-inset-left));
    padding-right: max(var(--pad), env(safe-area-inset-right));
  }

  .toast {
    bottom: max(1.4rem, env(safe-area-inset-bottom));
  }
}
