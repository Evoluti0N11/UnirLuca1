<script id="datos" type="application/json">
{"t":[{"id":"silaba","group":"Acentuación","title":"La sílaba tónica manda","kicker":"Fundamento","html":"\n  <p class=\"regla\">La tilde no decora: <b>marca la sílaba tónica</b> y solo aparece cuando la regla general lo exige. Para acentuar bien necesitas dos datos: dónde golpea la voz y cómo termina la palabra.</p>\n  <p>Primero localiza la tónica (di la palabra en voz alta y exagera la fuerza). Después mira la terminación. La combinación de ambos datos decide la tilde. Nada más.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Tipo</th><th>Sílaba tónica</th><th>Ejemplo</th><th>¿Tilde?</th></tr></thead>\n    <tbody>\n      <tr><td>Aguda</td><td>la última</td><td>can-<b>CIÓN</b></td><td>solo si acaba en vocal, -n o -s</td></tr>\n      <tr><td>Llana</td><td>la penúltima</td><td><b>ÁR</b>-bol</td><td>solo si NO acaba en vocal, -n o -s</td></tr>\n      <tr><td>Esdrújula</td><td>la antepenúltima</td><td><b>MÉ</b>-di-co</td><td>siempre</td></tr>\n      <tr><td>Sobresdrújula</td><td>anterior a la antepenúltima</td><td><b>DÍ</b>-ga-se-lo</td><td>siempre</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Truco inverso</span> Si la palabra ya lleva tilde, la tilde te está diciendo cuál es la tónica. Si no la lleva, deduce la tónica aplicando la regla al revés: <i>casa</i> no lleva tilde y acaba en vocal, luego es llana; <i>reloj</i> no lleva tilde y acaba en consonante distinta de -n o -s, luego es aguda.</div>\n  <p class=\"nota\">Cuenta las sílabas separando por vocales, pero cuidado: dos vocales seguidas pueden ir en la misma sílaba (diptongo) o en sílabas distintas (hiato). Eso cambia el número de sílabas y, con él, la tilde.</p>\n  "},{"id":"mono","group":"Acentuación","title":"Monosílabas: una sílaba, ninguna tilde","kicker":"Regla 1","html":"\n  <p class=\"regla\">Las palabras de una sola sílaba <b>no llevan tilde nunca</b>: <i>bien, con, dio, fe, fue, fui, mes, sal, ti, vio</i>.</p>\n  <p>La única excepción es la <b>tilde diacrítica</b>, que no marca pronunciación sino que distingue dos palabras que se escriben igual: <i>tú / tu, él / el, sí / si, más / mas, sé / se</i>.</p>\n  <div class=\"trampa\"><span class=\"tag\">Caso trampa</span> Hay secuencias que se consideran monosílabas a efectos ortográficos y por eso van sin tilde: <b>guion, truhan, ion, prion, fie, hui, liais</b>. Escribir <i>guión</i> o <i>truhán</i> era lo correcto antes de la <i>Ortografía</i> de 2010, pero hoy se recomienda la forma sin tilde. En un examen, la respuesta correcta es <b>guion</b>.</div>\n  <div class=\"examples\">\n    <div class=\"ex ok\"><b>bien</b> · <b>fue</b> · <b>vio</b> · <b>sal</b> · <b>guion</b></div>\n    <div class=\"ex bad\"><s>guión</s> · <s>fué</s> · <s>dío</s> · <s>víó</s></div>\n  </div>\n  <p class=\"nota\">Ojo: <i>dio</i>, <i>fue</i>, <i>vio</i> y <i>ti</i> no llevan tilde, aunque suenen con fuerza. Son monosílabos.</p>\n  "},{"id":"diacritica","group":"Acentuación","title":"Tilde diacrítica: la que distingue significados","kicker":"Regla 2","html":"\n  <p class=\"regla\">La tilde diacrítica no depende de la pronunciación: sirve para <b>diferenciar palabras que se escriben igual</b> pero significan cosas distintas. Afecta sobre todo a monosílabos y a los interrogativos.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Sin tilde</th><th>Con tilde</th><th>Contraste</th></tr></thead>\n    <tbody>\n      <tr><td>el (artículo)</td><td>él (pronombre)</td><td><i>el libro</i> / <i>él lo dijo</i></td></tr>\n      <tr><td>tu (posesivo)</td><td>tú (pronombre)</td><td><i>tu casa</i> / <i>tú vienes</i></td></tr>\n      <tr><td>mi (posesivo, nota)</td><td>mí (pronombre)</td><td><i>mi coche</i> / <i>a mí me gusta</i></td></tr>\n      <tr><td>si (condición, nota)</td><td>sí (afirmación, pronombre)</td><td><i>si vienes</i> / <i>dijo que sí</i></td></tr>\n      <tr><td>te (pronombre)</td><td>té (bebida)</td><td><i>te llamo</i> / <i>un té</i></td></tr>\n      <tr><td>de (preposición)</td><td>dé (verbo dar)</td><td><i>copa de vino</i> / <i>que dé ejemplo</i></td></tr>\n      <tr><td>se (pronombre)</td><td>sé (saber / ser)</td><td><i>se fue</i> / <i>no sé nada</i></td></tr>\n      <tr><td>mas (= pero)</td><td>más (cantidad)</td><td><i>quise ir, mas no pude</i> / <i>más gente</i></td></tr>\n      <tr><td>aun (= incluso)</td><td>aún (= todavía)</td><td><i>aun así</i> / <i>aún no llegó</i></td></tr>\n      <tr><td>que, cual, quien, como, cuando, donde, cuanto</td><td>qué, cuál, quién, cómo, cuándo, dónde, cuánto</td><td><i>la casa donde vivo</i> / <i>¿dónde vives?</i></td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Tres decisiones que la gente falla</span>\n  <b>1.</b> <i>solo</i>, <i>este, esta, estos, estas, aquel…</i> se escriben <b>hoy sin tilde</b>, aunque la norma antigua la pedía. Solo se admite la tilde en <i>solo</i> cuando hay riesgo real de ambigüedad, y no es obligatoria; puede escribirse con tilde si quien escribe aprecia un riesgo de ambigüedad, aunque se recomienda prescindir de ella.<br>\n  <b>2.</b> Los interrogativos llevan tilde <b>también en interrogativas indirectas</b>: <i>No sé qué hacer</i>, <i>Dime cómo estás</i>, <i>Pregúntale cuándo llega</i>.<br>\n  <b>3.</b> <i>aun</i> / <i>aún</i>: cambia la prueba. Si puedes poner <b>incluso</b>, va sin tilde; si puedes poner <b>todavía</b>, va con tilde.</div>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Forma</th><th>Función</th><th>Ejemplo</th></tr></thead>\n    <tbody>\n      <tr><td>por qué</td><td>pregunta (directa o indirecta)</td><td><i>¿Por qué no viniste?</i> / <i>No sé por qué lo hizo</i></td></tr>\n      <tr><td>porque</td><td>conjunción de causa</td><td><i>Lo hice porque me lo pediste</i></td></tr>\n      <tr><td>el porqué</td><td>sustantivo (= la causa)</td><td><i>No entiendo el porqué de su enfado</i></td></tr>\n      <tr><td>por que</td><td>= por el / la cual</td><td><i>Ese es el motivo por que vino</i></td></tr>\n    </tbody>\n  </table></div>\n  "},{"id":"agudas","group":"Acentuación","title":"Palabras agudas","kicker":"Regla 3","html":"\n  <p class=\"regla\">Tónica en la última sílaba. Llevan tilde cuando terminan en <b>vocal, -n o -s</b>. No la llevan cuando terminan en <b>otra consonante, en -y o en grupo de consonantes</b>.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Termina en</th><th>¿Tilde?</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>vocal (a, e, i, o, u)</td><td>sí</td><td>acá, comité, colibrí, iglú, café</td></tr>\n      <tr><td>-n o -s precedidas de vocal</td><td>sí</td><td>razón, compás, también, jamás</td></tr>\n      <tr><td>consonante distinta de n o s</td><td>no</td><td>actriz, amistad, reloj, beber</td></tr>\n      <tr><td>más de una consonante</td><td>no</td><td>esnobs, mamuts, zigzags</td></tr>\n      <tr><td>-s precedida de consonante</td><td>no</td><td>robots, tictacs</td></tr>\n      <tr><td>letra -y</td><td>no</td><td>convoy, virrey, Uruguay</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Trampa clásica</span> <i>reloj</i> y <i>virrey</i> no llevan tilde aunque la tónica sea la última, porque acaban en consonante distinta de -n/-s y en -y. En cambio <i>estáis</i>, <i>coméis</i>, <i>cantáis</i> sí la llevan: agudas acabadas en -s precedida de vocal.</div>\n  <div class=\"examples\">\n    <div class=\"ex ok\"><b>café</b> · <b>razón</b> · <b>compás</b> · <b>estudiáis</b> · <b>comité</b></div>\n    <div class=\"ex bad\"><s>relój</s> · <s>vírrrey</s> · <s>convóy</s> · <s>exámen</s></div>\n  </div>\n  "},{"id":"llanas","group":"Acentuación","title":"Palabras llanas (o graves)","kicker":"Regla 4","html":"\n  <p class=\"regla\">Tónica en la penúltima sílaba. Llevan tilde cuando terminan en <b>consonante distinta de -n o -s</b>, cuando terminan en <b>-y</b> y cuando la <b>-s final va precedida de otra consonante</b>.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Termina en</th><th>¿Tilde?</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>consonante distinta de n o s</td><td>sí</td><td>dólar, lápiz, túnel, césped, fútbol, cárcel</td></tr>\n      <tr><td>más de una consonante</td><td>sí</td><td>bíceps, récords, fórceps</td></tr>\n      <tr><td>-s precedida de consonante</td><td>sí</td><td>bíceps, fórceps, récords</td></tr>\n      <tr><td>letra -y</td><td>sí</td><td>yóquey, póney</td></tr>\n      <tr><td>vocal</td><td>no</td><td>libro, parque, lata, joven</td></tr>\n      <tr><td>-n o -s precedidas de vocal</td><td>no</td><td>examen, margen, crisis, joven</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Matiz que casi nadie ve</span> <b>crisis</b> es llana y <b>no</b> lleva tilde (la -s final va precedida de vocal), pero <b>análisis</b>, <b>hipótesis</b> y <b>parálisis</b> sí la llevan porque son <b>esdrújulas</b> (a-NÁ-li-sis). Y <b>bíceps</b> y <b>récords</b>, que son llanas, la llevan porque acaban en grupo de consonantes: -ps, -ds.</div>\n  <div class=\"examples\">\n    <div class=\"ex ok\"><b>árbol</b> · <b>lápiz</b> · <b>túnel</b> · <b>bíceps</b> · <b>yóquey</b></div>\n    <div class=\"ex bad\"><s>exámen</s> · <s>márgen</s> · <s>cóndor</s> · <s>analisis</s></div>\n  </div>\n  <p class=\"nota\">Prueba rápida: toda llana que <b>no</b> acabe en vocal, -n o -s lleva tilde. No hay más.</p>\n  "},{"id":"esdrujulas","group":"Acentuación","title":"Esdrújulas y sobresdrújulas","kicker":"Regla 5","html":"\n  <p class=\"regla\">Esdrújula: tónica en la antepenúltima. Sobresdrújula: tónica antes de la antepenúltima. <b>Las dos llevan tilde siempre</b>, sin excepciones y sin mirar la terminación.</p>\n  <div class=\"examples\">\n    <div class=\"ex ok\"><b>Esdrújulas:</b> médico, teléfono, murciélago, pájaro, hábitat, brújula, análisis, hipótesis</div>\n    <div class=\"ex ok\"><b>Sobresdrújulas:</b> dígaselo, cómetelo, recítenoslo, llévesemelas, permítaseme</div>\n  </div>\n  <div class=\"trampa\"><span class=\"tag\">Los adverbios en -mente</span> Suelen ser esdrújulas y algunos parecen sobresdrújulas, pero conservan <b>la tilde del adjetivo de origen</b>: <i>rápido → rápidamente</i>, <i>ágil → ágilmente</i>, <i>cortés → cortésmente</i>, <i>fácil → fácilmente</i>. Si el adjetivo no lleva tilde, el adverbio tampoco: <i>feliz → felizmente</i>.</div>\n  <p class=\"nota\">Las formas con pronombres añadidos (<i>dámelo, cuéntaselo</i>) son las que más tildes acumulan en español. Es el grupo de las sobresdrújulas.</p>\n  "},{"id":"plural","group":"Acentuación","title":"Del singular al plural: la tilde se mueve","kicker":"Regla 6","html":"\n  <p class=\"regla\">Al pasar al plural la palabra gana una sílaba y cambia de tipo. Resultado: <b>unas pierden la tilde y otras la ganan</b>. Nunca se copia la tilde del singular sin pensar.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Singular (sin tilde)</th><th>Plural (con tilde)</th><th>Por qué</th></tr></thead>\n    <tbody>\n      <tr><td>examen</td><td>exámenes</td><td>pasa a esdrújula</td></tr>\n      <tr><td>joven</td><td>jóvenes</td><td>pasa a esdrújula</td></tr>\n      <tr><td>imagen</td><td>imágenes</td><td>pasa a esdrújula</td></tr>\n      <tr><td>margen</td><td>márgenes</td><td>pasa a esdrújula</td></tr>\n      <tr><td>origen</td><td>orígenes</td><td>pasa a esdrújula</td></tr>\n      <tr><td>régimen</td><td>regímenes</td><td>la tónica se desplaza</td></tr>\n      <tr><td>espécimen</td><td>especímenes</td><td>la tónica se desplaza</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Singular (con tilde)</th><th>Plural (sin tilde)</th><th>Por qué</th></tr></thead>\n    <tbody>\n      <tr><td>canción</td><td>canciones</td><td>pasa a llana acabada en -s</td></tr>\n      <tr><td>francés</td><td>franceses</td><td>pasa a llana acabada en -s</td></tr>\n      <tr><td>autobús</td><td>autobuses</td><td>pasa a llana acabada en -s</td></tr>\n      <tr><td>inglés</td><td>ingleses</td><td>pasa a llana acabada en -s</td></tr>\n      <tr><td>alemán</td><td>alemanes</td><td>pasa a llana acabada en -s</td></tr>\n      <tr><td>carácter</td><td>caracteres</td><td>pasa a llana acabada en -s</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Dos que siempre caen</span> <b>carácter → caracteres</b> (la tilde desaparece) y <b>régimen → regímenes</b> (la tilde se mueve). <i>Tabú</i> admite <i>tabúes</i> y <i>tabús</i>; <i>juez</i> hace <i>jueces</i>.</div>\n  "},{"id":"diptongo","group":"Acentuación","title":"Diptongos y triptongos","kicker":"Secuencias vocálicas 1","html":"\n  <p class=\"regla\">Un <b>diptongo</b> son dos vocales en la misma sílaba; un <b>triptongo</b>, tres en la misma sílaba. La tilde se coloca sobre la <b>vocal abierta</b> (a, e, o); si las dos son cerradas (i, u), sobre la segunda.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Secuencia</th><th>¿Diptongo?</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>abierta + cerrada</td><td>sí</td><td>au-la, pei-ne, cai-go, bue-no</td></tr>\n      <tr><td>cerrada + abierta</td><td>sí</td><td>vier-nes, cua-tro, sue-ño</td></tr>\n      <tr><td>cerrada + cerrada distinta</td><td>sí</td><td>ciu-dad, cui-da-do</td></tr>\n      <tr><td>cerrada + abierta + cerrada</td><td>triptongo</td><td>buey, miau, averigüéis, cambiáis</td></tr>\n    </tbody>\n  </table></div>\n  <p>Los diptongos y triptongos siguen la <b>regla general</b>: se mira dónde está la tónica y cómo acaba la palabra.</p>\n  <div class=\"examples\">\n    <div class=\"ex ok\"><b>estudiáis</b> (aguda en -s, tilde en la abierta) · <b>huésped</b> (llana en -d) · <b>cuidado</b> (llana en vocal, sin tilde) · <b>cuídate</b> (esdrújula, tilde en la cerrada) · <b>jesuítico</b></div>\n    <div class=\"ex bad\"><s>estudiais</s> · <s>huesped</s> · <s>cúidate</s> · <s>ruído</s> (correcto: <b>ruido</b>, es diptongo y llana en vocal)</div>\n  </div>\n  <p class=\"nota\">La <b>h</b> muda no rompe el diptongo: <i>desahucio</i>, <i>ahijado</i>, <i>prohibir</i> (aquí sí hay hiato, pero no por la h).</p>\n  "},{"id":"hiato","group":"Acentuación","title":"Hiatos: cuando las vocales se separan","kicker":"Secuencias vocálicas 2","html":"\n  <p class=\"regla\">Un <b>hiato</b> son dos vocales que se pronuncian en sílabas distintas. El caso que más tildes genera es <b>vocal abierta + vocal cerrada tónica</b> (o al revés): la cerrada lleva tilde <b>siempre</b>, aunque la regla general no la pediría.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Tipo de hiato</th><th>¿Tilde?</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>abierta + cerrada tónica (o cerrada tónica + abierta)</td><td>sí, sobre la cerrada</td><td>pa-ís, ba-úl, ra-íz, re-ír, o-í-do, pro-hí-bo, bú-ho, a-hín-co, re-ú-ne</td></tr>\n      <tr><td>dos abiertas distintas</td><td>regla general</td><td>a-é-re-o, hé-ro-e, po-e-ta, to-a-lla, o-cé-a-no</td></tr>\n      <tr><td>vocal repetida</td><td>regla general</td><td>cre-er, le-er, al-co-hol</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Por qué se falla</span> Porque se aplica la regla general a un hiato. <i>Baúl</i> es aguda acabada en -l y por la regla general no llevaría tilde; la lleva por el hiato. Lo mismo <i>raíz</i>, <i>reír</i>, <i>oído</i>. Y al contrario: <i>ruido</i>, <i>fiel</i>, <i>viaje</i>, <i>ciudad</i>, <i>cruel</i> son diptongos y no llevan tilde.</div>\n  <div class=\"examples\">\n    <div class=\"ex ok\"><b>país</b> · <b>baúl</b> · <b>caída</b> · <b>oído</b> · <b>reír</b> · <b>prohibía</b> · <b>búho</b></div>\n    <div class=\"ex bad\"><s>pais</s> · <s>baul</s> · <s>oido</s> · <s>reir</s> · <s>prohibia</s></div>\n  </div>\n  <p class=\"nota\">Cuidado con <b>aún / aun</b>: <i>aún</i> con tilde = todavía; <i>aun</i> sin tilde = incluso.</p>\n  "},{"id":"hache_acento","group":"Acentuación","title":"La h intercalada no cambia nada","kicker":"Secuencias vocálicas 3","html":"\n  <p class=\"regla\">La <b>h</b> es muda y no influye en la acentuación: <b>no impide el diptongo, no impide el hiato y no cambia la tilde</b>.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Caso</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>hay diptongo a pesar de la h</td><td>des-<b>ahu</b>-cio, a-<b>hi</b>-ja-do, a-<b>hu</b>-ma-do</td></tr>\n      <tr><td>hay hiato a pesar de la h</td><td>pro-<b>hí</b>-bo, a-<b>hí</b>n-co, bú-<b>ho</b>, ta-<b>húr</b>, a-<b>za</b>-har</td></tr>\n      <tr><td>la tilde va donde toca, con h o sin ella</td><td>prohibir → prohíbo · rehén · zanahoria · ahínco</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Regla de oro</span> Para acentuar, <b>ignora la h</b>: quítala mentalmente y aplica la regla. <i>Prohíbo</i> → <i>pro-í-bo</i>: hiato, tilde en la cerrada. <i>Desahucio</i> → <i>de-sau-cio</i>: diptongo, llana en vocal, sin tilde.</div>\n  "},{"id":"compuestas","group":"Acentuación","title":"Compuestas, guion y adverbios en -mente","kicker":"Casos especiales","html":"\n  <p class=\"regla\">En una palabra compuesta escrita <b>en una sola pieza</b>, la tilde se calcula sobre el resultado, no sobre las partes: <i>decimoséptimo</i>, <i>veintidós</i>, <i>tiralíneas</i>, <i>puntapié</i>, <i>balompié</i>.</p>\n  <p>Si los componentes se unen <b>con guion</b>, cada parte conserva su propia tilde: <i>teórico-práctico</i>, <i>físico-químico</i>, <i>anglo-soviético</i>, <i>coste-beneficio</i>.</p>\n  <div class=\"trampa\"><span class=\"tag\">Los adverbios en -mente</span> Mantienen la tilde del adjetivo aunque el golpe de voz se desplace: <i>rápidamente</i>, <i>ágilmente</i>, <i>cortésmente</i>, <i>fácilmente</i>, <i>últimamente</i>. Y si el adjetivo no la llevaba, tampoco: <i>felizmente</i>, <i>libremente</i>.</div>\n  <div class=\"examples\">\n    <div class=\"ex ok\"><b>decimoséptimo</b> · <b>veintidós</b> · <b>hispanoamericano</b> · <b>físico-químico</b></div>\n    <div class=\"ex bad\"><s>décimoseptimo</s> · <s>veintidos</s> · <s>fisico-quimico</s></div>\n  </div>\n  <p class=\"nota\">Las formas verbales con pronombres (<i>dímelo, cómpraselo</i>) generan sobresdrújulas: tilde obligatoria.</p>\n  "},{"id":"latinismos","group":"Acentuación","title":"Mayúsculas, latinismos y extranjerismos","kicker":"Casos especiales","html":"\n  <p class=\"regla\">Las <b>mayúsculas llevan tilde</b> igual que las minúsculas: <i>África, Ángel, Álvaro, Óscar, Íñigo, ÁNGELA</i>. Nunca se «ahorra» la tilde por escribir en mayúscula.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Grupo</th><th>Qué pasa</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>Latinismos adaptados</td><td>se acentúan como palabras españolas</td><td>currículum, ítem, memorándum, réquiem, accésit, superávit, déficit, hábitat, cuórum</td></tr>\n      <tr><td>Latinismos crudos</td><td>en cursiva, sin tilde</td><td><i>a priori</i>, <i>statu quo</i>, <i>grosso modo</i></td></tr>\n      <tr><td>Extranjerismos adaptados</td><td>con tilde española</td><td>fútbol, cómic, sándwich, béisbol, carné, chalé, jerséis</td></tr>\n      <tr><td>Siglas</td><td>sin tilde aunque se lean acentuadas</td><td>RAE, ONU, IVA, RENFE</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Caso trampa</span> <i>Currículum</i> es llana acabada en -m: lleva tilde. <i>Ítem</i> también. En cambio <i>cuórum</i> es la forma adaptada (y <i>quórum</i>, el latinismo crudo en cursiva).</div>\n  "},{"id":"interrogativos","group":"Acentuación","title":"Interrogativos: también en pregunta indirecta","kicker":"Casos especiales","html":"\n  <p class=\"regla\">Las palabras <b>qué, quién, cuál, cómo, cuándo, dónde, cuánto</b> llevan tilde cuando tienen valor interrogativo o exclamativo, <b>aunque la pregunta sea indirecta y no haya signos</b>.</p>\n  <div class=\"examples\">\n    <div class=\"ex ok\"><b>Con tilde:</b> ¿Qué quieres? · No sé <b>qué</b> hacer · Dime <b>cómo</b> estás · Pregúntale <b>cuándo</b> vuelve · ¡<b>Cuánta</b> gente! · Ignoro <b>quién</b> lo dijo</div>\n    <div class=\"ex bad\"><b>Sin tilde (relativo o conjunción):</b> Creo <b>que</b> vendrá · La casa <b>donde</b> vivo · <b>Como</b> llovía, no salí · <b>Cuando</b> llegues, avísame · Los <b>que</b> vinieron</div>\n  </div>\n  <div class=\"trampa\"><span class=\"tag\">Truco</span> Si puedes sustituir por «¿…?» en tu cabeza y tiene sentido, lleva tilde. <i>Dime cuándo llegas</i> = «dime: ¿cuándo llegas?».</div>\n  <p class=\"nota\"><b>adónde / a dónde / adonde:</b> con valor interrogativo, <i>¿Adónde vas?</i> (o <i>¿A dónde vas?</i>); con valor relativo, sin tilde y en una palabra: <i>el pueblo adonde voy</i>.</p>\n  "},{"id":"bv","group":"Ortografía","title":"B y V: el reparto que casi nadie domina","kicker":"Bloque 1","html":"\n  <p class=\"regla\">No hay regla fonética: <b>b y v suenan igual</b> en español. Todo depende de la <b>terminación</b>, del <b>verbo de origen</b> y de la <b>familia de palabras</b>.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Se escribe B…</th><th>Ejemplos</th><th>Excepciones que sí importan</th></tr></thead>\n    <tbody>\n      <tr><td>delante de otra consonante</td><td>abdicar, hablar, objeto, obtener, obvio, pobre</td><td>ovni, grivna y algunos nombres propios extranjeros</td></tr>\n      <tr><td>al final de palabra</td><td>baobab, kebab</td><td>lev, molotov, y apellidos como Romanov</td></tr>\n      <tr><td>en la terminación -bilidad</td><td>habilidad, amabilidad, responsabilidad</td><td><b>civilidad, movilidad</b></td></tr>\n      <tr><td>en los verbos -bir y -buir</td><td>escribir, recibir, distribuir, contribuir</td><td><b>hervir, servir, vivir</b> y sus derivados</td></tr>\n      <tr><td>en el imperfecto -ba- (1.ª conjugación y verbo ir)</td><td>cantaba, lloraban, iba, íbamos</td><td>—</td></tr>\n      <tr><td>si el infinitivo la lleva, la conserva</td><td>absorber → absorbía; caber → cabía; haber → había</td><td>—</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Se escribe V…</th><th>Ejemplos</th><th>Ojo</th></tr></thead>\n    <tbody>\n      <tr><td>en adjetivos -avo, -ave, -eve, -evo, -ivo</td><td>octavo, grave, suave, breve, nuevo, longevo, activo, intuitivo</td><td>—</td></tr>\n      <tr><td>en formas de verbos sin /b/ en el infinitivo</td><td>tener → tuvo; estar → estuve; andar → anduvimos; ir → voy, vaya</td><td>pero el imperfecto siempre con <b>b</b>: andaba, iba</td></tr>\n      <tr><td>si el infinitivo la lleva, la conserva</td><td>volver → volvía; cavar → cavasteis; vendar → vendabas</td><td>—</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Las cuatro que caen siempre</span>\n  <b>1.</b> <i>tuvo / estuve / anduvo</i> con <b>v</b>, pero <i>andaba / estaba</i> con <b>b</b>.<br>\n  <b>2.</b> <i>movilidad</i> y <i>civilidad</i> son la excepción de -bilidad.<br>\n  <b>3.</b> <i>hervir, servir, vivir</i> rompen la regla de -bir.<br>\n  <b>4.</b> <i>absorbía</i> conserva la b del infinitivo; <i>escribía</i> también.</div>\n  <div class=\"examples\">\n    <div class=\"ex ok\"><b>iba</b> · <b>estuve</b> · <b>anduvimos</b> · <b>vivimos</b> · <b>movilidad</b> · <b>octavo</b></div>\n    <div class=\"ex bad\"><s>iva</s> · <s>estube</s> · <s>andubimos</s> · <s>vibimos</s> · <s>movilidad</s> escrito con b</div>\n  </div>\n  "},{"id":"czs","group":"Ortografía","title":"C, Z y S: el sonido /θ/ y sus trampas","kicker":"Bloque 2","html":"\n  <p class=\"regla\">Regla base: <b>c ante e, i</b>; <b>z ante a, o, u</b>; <b>z al final de sílaba o de palabra</b>.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Caso</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>c + e, i</td><td>cerilla, felicidad, calcetín, incienso</td></tr>\n      <tr><td>z + a, o, u</td><td>zapato, pozo, anzuelo</td></tr>\n      <tr><td>z final de sílaba o palabra</td><td>capaz, pez, luz, atroz, regaliz</td></tr>\n      <tr><td>z ante e, i (préstamos y nombres propios)</td><td>kamikaze, nazi, zéjel, zen, zepelín, zigzag, Zimbabue, Zeus, Ezequiel</td></tr>\n      <tr><td>cuando se admiten c y z, se prefiere c</td><td>cigoto, eccema, acimut, circonio, magacín</td></tr>\n      <tr><td>excepción de la excepción</td><td>se prefiere <b>zinc</b> a <i>cinc</i></td></tr>\n    </tbody>\n  </table></div>\n  <p class=\"regla\"><b>-ción o -cción:</b> si existe una palabra de la familia con <b>-ct-</b>, van dos c.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Una sola c (-ción)</th><th>Dos c (-cción)</th></tr></thead>\n    <tbody>\n      <tr><td>discreción (discreto), objeción (objeto), sujeción (sujeto), erudición (erudito), concreción (concreto)</td><td>acción (acto), adicción (adicto), dirección (directo), elección (electo), lección (lectivo), traducción (traductor)</td></tr>\n      <tr><td>aclamación, afición, evaluación, inflación, rendición, secreción, traición</td><td>cocción, confección, fricción, micción (sin -ct- evidente)</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Prueba de la familia</span> Antes de escribir -ción, busca un familiar con <b>ct</b>: si <i>directo</i> existe, <b>dirección</b> con cc; si solo existe <i>discreto</i>, <b>discreción</b> con una c. Y cuidado: <i>sujeción</i> (de sujeto) no es <i>subyección</i>.</div>\n  "},{"id":"sion","group":"Ortografía","title":"Plurales, diminutivos y -sión","kicker":"Bloque 3","html":"\n  <p class=\"regla\">Cuatro reglas que resuelven casi todas las dudas entre <b>s, z y c</b> en el interior y el final de palabra.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Regla</th><th>Ejemplos</th><th>Ojo</th></tr></thead>\n    <tbody>\n      <tr><td>El plural de -z pasa a <b>-ces</b></td><td>arroz → arroces; feliz → felices; audaz → audaces; lombriz → lombrices</td><td>nunca <i>arrozes</i></td></tr>\n      <tr><td>Diminutivo <b>-ecito</b> con c</td><td>bebecito, panecito, pececito</td><td>si la raíz tiene s, se conserva: paso → pasito; hueso → huesito, huesecito</td></tr>\n      <tr><td><b>-sión</b> en derivados de verbos -der, -dir, -ter, -tir que pierden d o t</td><td>comprender → comprensión; agredir → agresión; divertir → diversión</td><td>excepción: <b>atención</b></td></tr>\n      <tr><td><b>-sión</b> en derivados de -sar que pierden -sa-</td><td>precisar → precisión; progresar → progresión</td><td>—</td></tr>\n      <tr><td><b>-sión</b> en derivados de -primir y -cluir</td><td>imprimir → impresión; concluir → conclusión</td><td>—</td></tr>\n      <tr><td><b>-visión</b> en esa familia</td><td>previsión, revisión, televisión</td><td>excepción: <b>movición</b>, con c</td></tr>\n      <tr><td>Formas verbales con <b>s</b>, nunca z</td><td>has, quiso, pusieron, ves, vais</td><td><i>has</i> de haber ≠ <i>haz</i> de hacer</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Los tres pares que más se fallan</span>\n  <b>has / haz</b> (verbo haber / verbo hacer) · <b>ves / vez</b> (ver / sustantivo) · <b>quiso / quizo</b> (solo existe <i>quiso</i>).</div>\n  "},{"id":"cquk","group":"Ortografía","title":"C, QU y K: el sonido /k/","kicker":"Bloque 4","html":"\n  <p class=\"regla\"><b>c</b> ante a, o, u y en final de sílaba; <b>qu</b> ante e, i (la u no suena); <b>k</b> casi solo en préstamos.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Grafía</th><th>Contexto</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>c</td><td>ante a, o, u</td><td>capitán, color, cubo, máscara, cuenco</td></tr>\n      <tr><td>c</td><td>ante consonante, final de sílaba o palabra</td><td>crac, actor, bloc</td></tr>\n      <tr><td>qu</td><td>ante e, i</td><td>quedar, tanque, tranquilo, queso, quitar</td></tr>\n      <tr><td>k</td><td>préstamos y voces extranjeras</td><td>kebab, kart, kilo, kril, okupa</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Se prefiere C / QU</th><th>Se prefiere K</th></tr></thead>\n    <tbody>\n      <tr><td>folclore, póquer, quiosco, queroseno, polca, caqui, Corea, neoyorquino, telequinesia</td><td>bikini, euskera, kamikaze, kilo, kimono, kurdo, harakiri, pakistaní, vodka, troika</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Lo que la norma prohíbe</span> La <b>q suelta no existe</b> en español: siempre forma <i>qu</i>. Por eso se escribe <b>cuórum</b> (no <i>quórum</i> cuando se adapta), <b>cuásar</b>, <b>cuark</b>; y los topónimos se adaptan: <b>Catar</b>, <b>Irak</b>.</div>\n  "},{"id":"gj","group":"Ortografía","title":"G y J: el sonido /x/","kicker":"Bloque 5","html":"\n  <p class=\"regla\"><b>j</b> ante cualquier vocal y a final de palabra; <b>g</b> ante e, i para el sonido fuerte, y ante a, o, u o consonante para el sonido suave; <b>gu</b> ante e, i con u muda.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Regla de la J</th><th>Ejemplos</th><th>Excepciones</th></tr></thead>\n    <tbody>\n      <tr><td>palabras en -aje, -ajes</td><td>garaje, homenaje, tatuaje, bricolaje, menaje</td><td>ambages, enálage, hipálage</td></tr>\n      <tr><td>formas verbales con /x/ que no está en el infinitivo</td><td>traer → trajiste; conducir → condujimos; deducir → dedujeras</td><td>—</td></tr>\n      <tr><td>se conserva en derivados de raíces con j</td><td>complejo → complejidad; esponja → esponjita; reloj → relojes; ojo → ojeras</td><td>—</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Regla de la G</th><th>Ejemplos</th><th>Ojo</th></tr></thead>\n    <tbody>\n      <tr><td>verbos -ger, -gir</td><td>coger, proteger, corregir, elegir, dirigir</td><td>excepciones: <b>tejer, crujir</b> y derivados</td></tr>\n      <tr><td>la g pasa a j ante a, o para mantener el sonido</td><td>coger → cojo, cojas; elegir → elijo; proteger → protejamos</td><td>—</td></tr>\n      <tr><td>terminaciones -logía, -rragia, -fagia, -algia</td><td>filología, hemorragia, onicofagia, lumbalgia</td><td>—</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">La regla que explica todo</span> La <b>j</b> y la <b>g</b> compiten por el mismo sonido, pero la g solo lo produce ante <b>e, i</b>. Por eso, cuando el verbo cambia de vocal, la g se transforma en j: <i>dirigir → dirigía</i> (g), <i>dirigir → dirijo</i> (j). Nunca <i>dirigo</i>.</div>\n  "},{"id":"hache","group":"Ortografía","title":"La H: muda, pero obligatoria","kicker":"Bloque 6","html":"\n  <p class=\"regla\">La <b>h</b> no se pronuncia, así que solo se controla con reglas y por familias de palabras.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Regla</th><th>Ejemplos</th><th>Excepciones</th></tr></thead>\n    <tbody>\n      <tr><td>h ante ua, ue, ui al principio de palabra o sílaba</td><td>huella, huevo, hueso, huerto, huir, ahuecar, cacahuete, deshuesar, marihuana</td><td>fideuá, Malaui, saharaui, alauí</td></tr>\n      <tr><td>h ante ia, ie al principio de palabra</td><td>hiato, hielo, hiena, hierba, hierro, hiedra</td><td>—</td></tr>\n      <tr><td>interjecciones que acaban en h</td><td>ah, eh, oh, uh, buah</td><td>—</td></tr>\n      <tr><td>los prefijos conservan la h de la base</td><td>deshacer, desheredar, deshonra, enhebrar, enhorabuena</td><td>—</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Con H</th><th>Sin H</th></tr></thead>\n    <tbody>\n      <tr><td>deshacer, desheredar, deshonra</td><td>desechar</td></tr>\n      <tr><td>enhebrar, enhiesto, enhorabuena</td><td>enajenar, enardecer, enorgullecer</td></tr>\n      <tr><td>exhalar, exhausto, exhibir, exhortar, exhumar</td><td>exacto, exagerar, examen, éxito, éxodo, exuberante, exótico</td></tr>\n      <tr><td>inhalar, inhibir, inhumano</td><td>inicuo, inocuo, inodoro, inopia</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Dobles y aspiradas</span> Algunas palabras admiten las dos formas, aunque se prefiere la que no lleva h: <i>armonía / harmonía</i>, <i>arpa / harpa</i>, <i>alacena / alhacena</i>, <i>sabiondo / sabihondo</i>, <i>uy / huy</i>. Y en préstamos como <b>hámster, haiku, hachís, hándicap, Hawái</b> la h sí se aspira: se escribe siempre.</div>\n  "},{"id":"lly","group":"Ortografía","title":"LL y Y","kicker":"Bloque 7","html":"\n  <p class=\"regla\">En la mayor parte del mundo hispánico <b>ll</b> y <b>y</b> suenan igual (yeísmo), así que la diferencia es puramente ortográfica.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Se escribe LL…</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>en palabras terminadas en -illo, -illa</td><td>anillo, alcantarilla, cucharilla, ladrillo, morcilla, ovillo</td></tr>\n      <tr><td>en verbos en -ellar, -illar, -ullar, -ullir</td><td>atropellar, estrellar, sellar, chillar, humillar, aullar, maullar, bullir, engullir</td></tr>\n      <tr><td>en las formas de verbos cuyo infinitivo lleva ll</td><td>callarse → se calló; bullir → bulló; escabullirse → se escabulleron</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Se escribe Y…</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>tras los prefijos ad-, des-, dis-, sub-</td><td>adyacente, desyemar, disyuntivo, subyacer, subyugar</td></tr>\n      <tr><td>en formas verbales sin y ni ll en el infinitivo</td><td>ir → yendo; caer → cayó; creer → creyera; huir → huyeron</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Dos trampas</span> <b>1.</b> <i>yendo</i>, <i>cayó</i>, <i>leyó</i>, <i>oyó</i>, <i>huyeron</i> van con y porque el infinitivo no la tenía. <b>2.</b> <i>subyacer</i> y <i>adyacente</i> llevan y porque la base empieza por vocal y el prefijo acaba en vocal: la y evita el hiato.</div>\n  "},{"id":"mn","group":"Ortografía","title":"M o N: la regla más rentable","kicker":"Bloque 8","html":"\n  <p class=\"regla\">Antes de <b>p</b> y <b>b</b> se escribe <b>m</b>; antes de <b>v</b> y de cualquier otra consonante, <b>n</b>.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Contexto</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>m + p, m + b</td><td>amparo, comparar, cumpleaños, rumba, imberbe, campo, bombilla</td></tr>\n      <tr><td>n + v</td><td>enviar, invitar, convite, convoy, invento</td></tr>\n      <tr><td>prefijación y composición: n → m ante b, p</td><td>en + botella → embotellar; in + posible → imposible; cien + pies → ciempiés</td></tr>\n      <tr><td>ante v la n se conserva</td><td>in + visible → invisible; en + viar → enviar</td></tr>\n      <tr><td>excepciones (siglas y nombres extranjeros)</td><td>ANBA, steinbeckiano</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Para memorizar</span> <b>Antes de p y b, m; antes de v, n.</b> Y la palabra <i>envío</i> lleva n porque la v manda.</div>\n  "},{"id":"rr","group":"Ortografía","title":"R y RR","kicker":"Bloque 9","html":"\n  <p class=\"regla\"><b>r</b> para el sonido suave entre vocales y para el final de sílaba; <b>rr</b> para el sonido fuerte entre vocales; al principio de palabra, una sola <b>r</b> aunque suene fuerte.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Se escribe R…</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>entre vocales con sonido suave</td><td>cara, arena, pero, ahora</td></tr>\n      <tr><td>al final de sílaba o de palabra</td><td>ardilla, comer, árbol, puerta</td></tr>\n      <tr><td>después de consonante, aunque suene fuerte</td><td>brazo, madre, negro, alrededor, enredar, disruptivo, problema</td></tr>\n      <tr><td>al principio de palabra</td><td>ratón, rosa, rico</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Se escribe RR…</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>entre vocales con sonido fuerte</td><td>carro, chirriar, ahorro, perro</td></tr>\n      <tr><td>al unir prefijo o palabra que acaba en vocal con una r inicial</td><td>infrarrojos, prerreserva, multirracial, vicerrector, bajorrelieve</td></tr>\n      <tr><td>cuando un elemento acaba en r y el siguiente empieza por r</td><td>interracial, superrico</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Contraste clave</span> <b>caro</b> (r suave) frente a <b>carro</b> (rr fuerte). Y en las palabras compuestas: <i>infra + rojos</i> → <b>infrarrojos</b> con dos erres; <i>super + rico</i> → <b>superrico</b>.</div>\n  "},{"id":"wyi","group":"Ortografía","title":"W, Y e I: letras de frontera","kicker":"Bloque 10","html":"\n  <p class=\"regla\">La <b>w</b> solo aparece en préstamos; la <b>y</b> y la <b>i</b> se reparten según el sonido sea consonántico, vocálico átono final o tónico.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>W</th><th>Detalle</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>préstamos</td><td>sonido [gu] o [u]</td><td>waterpolo, sándwich, web, wéstern, hawaiano</td></tr>\n      <tr><td>origen germánico, polaco, holandés</td><td>se pronuncia [b]</td><td>Wagner, Witiza, Wamba, wolframio, Kowalski</td></tr>\n      <tr><td>adaptada como u</td><td>grafía española</td><td>suajili, suéter, Zimbabue, Malaui</td></tr>\n      <tr><td>dobles admitidas</td><td>se prefiere la primera</td><td>taekwondo/taekuondo; wiski (preferible a <i>güisqui</i>); wasap/guasap</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Y / I</th><th>Regla</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>i para el sonido vocálico</td><td>consonántico no</td><td>aire, indio, reina, penalti, dandi</td></tr>\n      <tr><td>y al final tras vocal átona</td><td>diptongo en -y</td><td>jersey, Uruguay, hay, hoy, buey</td></tr>\n      <tr><td>excepciones con tilde</td><td>i tónica final</td><td>samurái, bonsái, sonreí, alauí, berbiquí (pero <b>muy</b>, sin tilde)</td></tr>\n      <tr><td>y en la conjunción</td><td>—</td><td>Juan y Antonio (pero <b>u</b> ante palabra con u-: <i>uno u otro</i>)</td></tr>\n      <tr><td>i en plurales de -y</td><td>—</td><td>espray → espráis; yóquey → yoqueis</td></tr>\n      <tr><td>i en numerales unidos</td><td>—</td><td>veintiuno, treintaiuno, cincuentaiocho</td></tr>\n      <tr><td>alternancias</td><td>—</td><td>hiedra/yedra; hierba/yerba; yodo/iodo; pero solo <b>hielo, hierro, hiena</b></td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Trampa de la conjunción</span> La conjunción copulativa es <b>y</b>, pero se convierte en <b>e</b> ante palabra que empieza por <i>i-</i> o <i>hi-</i>: <i>padre e hijo</i>, <i>aguja e hilo</i>. No se hace ante <i>hie-</i>: <i>agua y hielo</i>. Y la disyuntiva es <b>o</b>, que pasa a <b>u</b> ante <i>o-</i> y <i>ho-</i>: <i>uno u otro</i>, <i>siete u ocho</i>.</div>\n  "},{"id":"repaso","group":"Ortografía","title":"Tabla final de repaso","kicker":"Resumen","html":"\n  <p class=\"regla\">Todo el bloque anterior en una sola tabla. Úsala como último repaso antes de un examen o una revisión de texto.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Letras</th><th>Regla clave</th></tr></thead>\n    <tbody>\n      <tr><td>B / V</td><td>-bilidad, -bir, -buir y el imperfecto -ba- llevan b; muchos adjetivos en -ivo llevan v</td></tr>\n      <tr><td>C / Z / S</td><td>c ante e, i; z ante a, o, u y al final; z → c en el plural</td></tr>\n      <tr><td>-ción / -cción</td><td>cc si hay un familiar con -ct- (acción / acto)</td></tr>\n      <tr><td>C / QU / K</td><td>c ante a, o, u; qu ante e, i; k en préstamos</td></tr>\n      <tr><td>G / J</td><td>g en -ger, -gir, -logía; j en -aje y en traje, condujo</td></tr>\n      <tr><td>H</td><td>ante ua, ue, ui y ante ia, ie iniciales; los prefijos la conservan</td></tr>\n      <tr><td>LL / Y</td><td>ll en -illo, -illa y en ciertos verbos; y en yendo, cayó, creyó</td></tr>\n      <tr><td>M / N</td><td>m antes de p y b; n antes de v</td></tr>\n      <tr><td>R / RR</td><td>rr entre vocales para el sonido fuerte; r en los demás casos</td></tr>\n      <tr><td>W</td><td>préstamos; puede adaptarse como u o gu</td></tr>\n      <tr><td>Y / I</td><td>y al final tras vocal átona; i para el sonido vocálico</td></tr>\n    </tbody>\n  </table></div>\n  "},{"id":"puntuacion","group":"Norma y estilo","title":"Puntuación: los signos que cambian el sentido","kicker":"Bloque 11","html":"\n  <p class=\"regla\">Los signos no son decoración: <b>organizan el significado</b>. Un texto con la puntuación descuidada produce frases ambiguas o directamente falsas.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Signo</th><th>Uso esencial</th><th>Error típico</th></tr></thead>\n    <tbody>\n      <tr><td><b>coma</b></td><td>separa elementos de una enumeración, incisos, vocativos y oraciones subordinadas antepuestas</td><td>comillas… no; <i>coma entre sujeto y verbo</i>: <i>*Los alumnos, llegaron tarde</i></td></tr>\n      <tr><td><b>punto y coma</b></td><td>separa unidades mayores que la coma, sobre todo si ya hay comas dentro</td><td>usarlo donde bastaría una coma o un punto</td></tr>\n      <tr><td><b>dos puntos</b></td><td>anuncian enumeración, cita textual o consecuencia</td><td>ponerlos tras <i>como</i>, <i>por ejemplo</i> o <i>es decir</i> en medio de la frase</td></tr>\n      <tr><td><b>comillas</b></td><td>citas textuales y palabras usadas como palabra («» preferibles en textos impresos)</td><td>mezclar « », “ ” y \" \" en el mismo texto</td></tr>\n      <tr><td><b>raya</b> (—)</td><td>incisos y diálogos</td><td>confundirla con el <b>guion</b> (-): <i>Málaga-Barcelona</i> con guion; <i>—dijo ella—</i> con raya</td></tr>\n      <tr><td><b>puntos suspensivos</b></td><td>enumeración abierta, duda, suspenso</td><td>escribir más de tres (<i>*…</i>), o añadir punto tras ellos si cierran la frase</td></tr>\n      <tr><td><b>¿ ¡</b></td><td>obligatorios al abrir en español</td><td>escribir solo el signo de cierre en textos formales</td></tr>\n      <tr><td><b>punto</b></td><td>cierran enunciado; también abreviatura (siempre con espacio detrás)</td><td>abreviaturas con doble punto: <i>*EE. UU..</i></td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Dos usos que la Academia prohíbe</span> <b>1.</b> La coma entre sujeto y predicado, salvo inciso: <i>*Mi hermano, estudia Medicina</i> es incorrecto. <b>2.</b> El signo de cierre doble: después de <i>? !</i> no se añade punto, aunque sí pueden ir seguidos de otros signos.</div>\n  <p class=\"nota\"><b>Ojo con el vocativo:</b> <i>Vamos a comer, niños</i> (les hablo a los niños) ≠ <i>Vamos a comer niños</i> (menudo problema). La coma cambia el sentido por completo.</p>\n  "},{"id":"mayusculas","group":"Norma y estilo","title":"Mayúsculas: cuándo sí y cuándo no","kicker":"Bloque 12","html":"\n  <p class=\"regla\">La mayúscula no expresa importancia ni respeto <b>fuera del nombre propio</b>. En español es más restrictiva que en inglés.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Con mayúscula</th><th>Con minúscula</th></tr></thead>\n    <tbody>\n      <tr><td>nombres propios: <i>María, Madrid, Amazonas, Google</i></td><td>días y meses: <i>lunes, enero</i></td></tr>\n      <tr><td>inicio de enunciado y después de punto</td><td>idiomas y gentilicios: <i>español, madrileño</i></td></tr>\n      <tr><td>títulos y tratamientos abreviados: <i>Sr.ª, D., Dr., Excmo.</i></td><td>cargos: <i>el presidente, el rey, el papa</i> (salvo cuando equivalen a nombre propio en documentos oficiales)</td></tr>\n      <tr><td>siglas y acrónimos: <i>ONU, RAE, ADN</i></td><td>nombres de asignaturas y disciplinas: <i>matemáticas, historia</i></td></tr>\n      <tr><td>títulos de obra: primera palabra y nombres propios (<i>Cien años de soledad</i>)</td><td>monedas, meses en fecha, estaciones: <i>verano, euro</i></td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Cuatro que se escriben con minúscula</span> <i>lunes</i>, <i>enero</i>, <i>español</i>, <i>matemáticas</i>. Y las mayúsculas <b>llevan tilde</b>: <i>Ángela, Óscar, África</i>. Una palabra escrita toda en mayúsculas tampoco pierde la tilde: <i>ÁMBITO</i>.</div>\n  "},{"id":"siglas","group":"Norma y estilo","title":"Siglas, abreviaturas, números y fechas","kicker":"Bloque 13","html":"\n  <p class=\"regla\">Cada tipo de abreviatura tiene su propia lógica. Mezclarlas es el error más visible en un trabajo académico.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Tipo</th><th>Regla</th><th>Ejemplos</th></tr></thead>\n    <tbody>\n      <tr><td>sigla</td><td>sin puntos, sin tilde, con artículo según cómo se lea</td><td>ONU (la ONU), OTAN (la OTAN), IVA (el IVA), ADN (el ADN)</td></tr>\n      <tr><td>acrónimo</td><td>si se lee como palabra y tiene más de cuatro letras, va en minúscula</td><td>ovni, pyme, sida, uci</td></tr>\n      <tr><td>abreviatura</td><td>con punto, espacio después</td><td>pág., Sr., etc., a. C., EE. UU.</td></tr>\n      <tr><td>símbolos</td><td>sin punto, sin plural, con espacio</td><td>25 kg, 3 km, 40 %, 12 €</td></tr>\n      <tr><td>números</td><td>la elección entre cifras y palabras depende del género y la guía editorial; mantén un criterio coherente y escribe los números grandes sin punto como separador de millares (1 500)</td><td>tres amigos; 1 500 personas; 12 000 €</td></tr>\n      <tr><td>fechas</td><td>día + mes en minúscula + año; nunca 1.º de enero con punto y coma mezclados</td><td>3 de mayo de 2024; 3/5/2024</td></tr>\n      <tr><td>horas</td><td>pueden escribirse con dos puntos (18:30) o con punto y h (18.30 h), según el sistema elegido</td><td>18.30 h · 18:30</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">El error de oro</span> <b>ONU</b> no lleva puntos ni tilde aunque se lea «onu». Y <b>etc.</b> siempre con punto y con coma delante si cierra enumeración: <i>manzanas, peras, etc.</i></div>\n  "},{"id":"digital","group":"Norma y estilo","title":"Escritura digital: correo, mensajería y redes","kicker":"Bloque 14","html":"\n  <p class=\"regla\">El canal cambia el registro, <b>no la ortografía</b>. Un correo institucional se rige por la norma; un chat admite economía, pero no faltas que te hagan perder credibilidad.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Contexto</th><th>Convenciones</th></tr></thead>\n    <tbody>\n      <tr><td>correo académico o profesional</td><td>asunto concreto, saludo, cuerpo en párrafos breves, cierre y firma; sin emoticonos ni abreviaturas de chat; revisar antes de enviar</td></tr>\n      <tr><td>mensajería instantánea</td><td>se admiten frases cortas y elisiones, pero se mantienen tildes y signos de apertura; los audios y los mensajes de una sola línea no sustituyen a una explicación</td></tr>\n      <tr><td>redes sociales</td><td>el # y la @ se usan para etiquetar; las mayúsculas sostenidas se leen como grito; los enlaces se presentan con texto descriptivo</td></tr>\n      <tr><td>emoticonos</td><td>admitidos en lo informal, nunca en un trabajo académico; no sustituyen a la puntuación</td></tr>\n      <tr><td>formatos</td><td>negrita y cursiva para jerarquizar; evitar subrayados (se confunden con enlaces) y bloques enteros en mayúsculas</td></tr>\n      <tr><td>netiqueta</td><td>no reenviar cadenas, citar solo lo necesario del mensaje anterior, responder en un plazo razonable</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Los tres errores que más cuestan</span> Enviar sin revisar el asunto; usar <i>x</i> o <i>k</i> en un correo institucional; y escribir «Hola, buenas» cuando el saludo debe incluir el nombre y el motivo.</div>\n  "},{"id":"gramatica","group":"Norma y estilo","title":"Dudas gramaticales que delatan","kicker":"Bloque 15","html":"\n  <p class=\"regla\">Estas no son faltas de ortografía: son <b>errores de construcción o de concordancia</b>. Algunas formas admiten variantes; aquí se distingue entre error y preferencia de estilo.</p>\n  <div class=\"tw\"><table class=\"tabla\">\n    <thead><tr><th>Evita</th><th>Mejor / correcto</th><th>Por qué</th></tr></thead>\n    <tbody>\n      <tr><td><i>*Pienso de que vendrá</i></td><td><i>Pienso que vendrá</i></td><td><b>Dequeísmo</b>: <i>pensar</i> no rige «de».</td></tr>\n      <tr><td><i>*Me alegro que vengas</i></td><td><i>Me alegro de que vengas</i></td><td><b>Queísmo</b>: <i>alegrarse</i> rige «de».</td></tr>\n      <tr><td><i>*Han habido problemas</i></td><td><i>Ha habido problemas</i></td><td><i>Haber</i> impersonal va en singular.</td></tr>\n      <tr><td><i>*Habían muchas personas</i></td><td><i>Había muchas personas</i></td><td>El verbo impersonal <i>haber</i> no concuerda con el complemento.</td></tr>\n      <tr><td><i>*Delante mío</i></td><td><i>Delante de mí</i></td><td>En el uso cuidado, los adverbios de lugar se construyen con <i>de + pronombre</i>, no con posesivo.</td></tr>\n      <tr><td><i>*Prevee</i></td><td><i>Prevé</i> / <i>preverá</i></td><td><i>Prever</i> se conjuga como <i>ver</i>: previó, prevén.</td></tr>\n      <tr><td><i>*Dijieron</i></td><td><i>Dijeron</i></td><td>El pretérito de <i>decir</i> es irregular: dije, dijo, dijeron.</td></tr>\n      <tr><td><i>*Satisfació</i></td><td><i>Satisfizo</i></td><td><i>Satisfacer</i> sigue el modelo de <i>hacer</i>: hizo, satisfizo.</td></tr>\n      <tr><td><i>*Haiga, *vinistes, *andastes</i></td><td><i>Haya, viniste, anduviste</i></td><td>Las formas normativas son haya, viniste y anduviste.</td></tr>\n      <tr><td><i>*En base a</i> (en prosa formal)</td><td><i>Con base en</i>, <i>sobre la base de</i></td><td>Recomendación de estilo para evitar una construcción muy extendida pero discutida.</td></tr>\n      <tr><td><i>Imprimido / impreso</i>; <i>freído / frito</i></td><td><b>Ambas formas son correctas</b></td><td>Son participios dobles; no marques <i>imprimido</i> o <i>freído</i> como errores.</td></tr>\n      <tr><td><i>Le vi a Juan</i></td><td><i>Lo vi a Juan</i> (preferencia general)</td><td>El uso de <i>le</i> como objeto directo masculino de persona (<b>leísmo</b>) se admite en parte de la norma; <i>lo</i> es la forma general y más extendida.</td></tr>\n    </tbody>\n  </table></div>\n  <div class=\"trampa\"><span class=\"tag\">Prueba del dequeísmo</span> Haz la pregunta: si la respuesta empieza por «de», el «de» es necesario. <i>¿Qué piensas?</i> → «que vendrá», no «de que vendrá». <i>¿De qué te alegras?</i> → «de que vengas». Y recuerda: una variante que no prefieres no es automáticamente una falta (por ejemplo, <i>impreso</i> e <i>imprimido</i> son correctos).</div>\n  "}],"ac":[{"w":"café","b":"cafe","t":"aguda","f":"vocal","v":["cafe","cáfe"],"h":0},{"w":"razón","b":"razon","t":"aguda","f":"ns","v":["razon","rázon"],"h":0},{"w":"compás","b":"compas","t":"aguda","f":"ns","v":["compas","cómpas"],"h":0},{"w":"también","b":"tambien","t":"aguda","f":"ns","v":["tambien","támbien","tambíen"],"h":0},{"w":"jamás","b":"jamas","t":"aguda","f":"ns","v":["jamas","jámas"],"h":0},{"w":"acá","b":"aca","t":"aguda","f":"vocal","v":["aca","áca"],"h":0},{"w":"comité","b":"comite","t":"aguda","f":"vocal","v":["comite","cómite","comíte"],"h":0},{"w":"colibrí","b":"colibri","t":"aguda","f":"vocal","v":["colibri","cólibri","colíbri"],"h":0},{"w":"iglú","b":"iglu","t":"aguda","f":"vocal","v":["iglu","íglu"],"h":0},{"w":"bebé","b":"bebe","t":"aguda","f":"vocal","v":["bebe","bébe"],"h":0},{"w":"papá","b":"papa","t":"aguda","f":"vocal","v":["papa","pápa"],"h":0},{"w":"sofá","b":"sofa","t":"ag e a clase.","y":"Nunca se separa el <b>sujeto</b> del <b>predicado</b> con una coma. «Los alumnos» es el sujeto y detrás va directamente el verbo.","r":"puntuacion"},{"a":"Mi hermano estudia Medicina en Salamanca.","b":"Mi hermano, estudia Medicina en Salamanca.","y":"La coma entre sujeto y verbo es uno de los errores más frecuentes: no hay inciso que la justifique.","r":"puntuacion"},{"a":"Vamos a comer, niños.","b":"Vamos a comer niños.","y":"El <b>vocativo</b> (a quién nos dirigimos) va separado por coma. Sin ella, la frase dice que nos vamos a comer a los niños.","r":"puntuacion"},{"a":"Ana, ven un momento, por favor.","b":"Ana ven un momento por favor.","y":"El nombre de la persona a la que se habla es un <b>vocativo</b> y va entre comas; los incisos también se separan.","r":"puntuacion"},{"a":"No vino nadie; sin embargo, la reunión se celebró.","b":"No vino nadie, sin embargo, la reunión se celebró.","y":"Antes de conectores como <i>sin embargo</i>, <i>no obstante</i> o <i>por tanto</i> se usa <b>punto y coma</b> (o punto) y después, coma.","r":"puntuacion"},{"a":"Tienes que traer tres cosas: papel, bolígrafo y regla.","b":"Tienes que traer tres cosas, papel, bolígrafo y regla.","y":"Los <b>dos puntos</b> anuncian la enumeración que viene después de «tres cosas».","r":"puntuacion"},{"a":"Terminó el informe, es decir, lo entregó a tiempo.","b":"Terminó el informe, es decir: lo entregó a tiempo.","y":"Los <b>dos puntos</b> no se escriben detrás de <i>es decir</i>, <i>por ejemplo</i>, <i>como</i> o <i>esto es</i> cuando el enunciado continúa: se usa coma.","r":"puntuacion"},{"a":"Dijo: «No pienso ir».","b":"Dijo, «No pienso ir».","y":"Las <b>citas textuales</b> se introducen con dos puntos y entre comillas.","r":"puntuacion"},{"a":"—No pienso ir —contestó ella—.","b":"–No pienso ir –contestó ella–.","y":"En los diálogos se usa la <b>raya</b> (—), no el guion (-), que sirve para unir palabras (<i>Málaga-Barcelona</i>).","r":"puntuacion"},{"a":"El proyecto —que llevaba dos años parado— se aprobó ayer.","b":"El proyecto (—que llevaba dos años parado—) se aprobó ayer.","y":"Los <b>incisos</b> se encierran entre rayas o entre paréntesis, pero no se mezclan los dos signos.","r":"puntuacion"},{"a":"No sé si vendrá... Quizá esté esperando el autobús.","b":"No sé si vendrá.... Quizá esté esperando el autobús.","y":"Los <b>puntos suspensivos</b> son siempre <b>tres</b>, nunca cuatro, aunque cierren la frase.","r":"puntuacion"},{"a":"¿Vienes o te quedas?","b":"Vienes o te quedas?","y":"En español los signos de interrogación y exclamación son <b>dobles</b>: se abren y se cierran.","r":"puntuacion"},{"a":"¡Qué calor hace!","b":"¡Que calor hace!","y":"La exclamación necesita los dos signos, y el <i>qué</i> exclamativo lleva <b>tilde</b>.","r":"puntuacion"},{"a":"Ha estudiado EE. UU. y Canadá.","b":"Ha estudiado EE.UU.. y Canadá.","y":"La abreviatura <b>EE. UU.</b> lleva punto y espacio después de cada punto, y el punto de la abreviatura sirve también como punto final.","r":"puntuacion"},{"a":"Se jubiló en 2020. Ese año viajó por Europa.","b":"Se jubiló en 2020. ese año viajó por Europa.","y":"Después de <b>punto</b> se escribe mayúscula inicial.","r":"puntuacion"},{"a":"Me preguntó: «¿Has terminado?»","b":"Me preguntó, «¿Has terminado?»","y":"La <b>cita</b> va tras dos puntos y las interrogaciones mantienen sus dos signos.","r":"puntuacion"},{"a":"Su dirección: calle Mayor, 14, 3.º B.","b":"Su dirección: calle Mayor, 14, 3º B.","y":"El <b>ordinal abreviado</b> lleva punto: <i>3.º</i>, <i>1.ª</i>.","r":"puntuacion"},{"a":"El lunes tengo examen de historia.","b":"El Lunes tengo examen de Historia.","y":"Los <b>días de la semana</b> y las <b>disciplinas</b> se escriben con minúscula en español.","r":"mayusculas"},{"a":"Nací en enero, el día 3.","b":"Nací en Enero, el día 3.","y":"Los <b>meses</b> van en minúscula.","r":"mayusculas"},{"a":"El verano pasado viajé a México.","b":"El Verano pasado viajé a México.","y":"Las <b>estaciones</b> del año también van en minúscula.","r":"mayusculas"},{"a":"Hablo español y un poco de francés.","b":"Hablo Español y un poco de Francés.","y":"Los <b>idiomas</b> se escriben con minúscula.","r":"mayusculas"},{"a":"Mi vecino es argentino.","b":"Mi vecino es Argentino.","y":"Los <b>gentilicios</b> van en minúscula.","r":"mayusculas"},{"a":"El presidente del Gobierno compareció ayer.","b":"El Presidente del Gobierno compareció ayer.","y":"Los <b>cargos</b> se escriben con minúscula, aunque sean importantes.","r":"mayusculas"},{"a":"El rey recibió a los embajadores.","b":"El Rey recibió a los embajadores.","y":"Los títulos y cargos (<i>rey</i>, <i>presidente</i>, <i>papa</i>) van en minúscula cuando funcionan como nombres comunes.","r":"mayusculas"},{"a":"Estudio matemáticas en la facultad.","b":"Estudio Matemáticas en la Facultad.","y":"Las <b>asignaturas</b> y las disciplinas van en minúscula; <i>facultad</i> también, salvo cuando forma parte del nombre propio del centro.","r":"mayusculas"},{"a":"He leído Cien años de soledad.","b":"He leído Cien Años de Soledad.","y":"En los <b>títulos de obra</b> solo se escribe con mayúscula la primera palabra y los nombres propios.","r":"mayusculas"},{"a":"Trabajo en el Ministerio de Educación.","b":"Trabajo en el ministerio de educación.","y":"Cuando el nombre es el <b>nombre propio oficial</b> de una institución, va con mayúsculas: Ministerio de Educación.","r":"mayusculas"},{"a":"Ángela y Óscar llegaron tarde.","b":"ángela y óscar llegaron tarde.","y":"Los <b>nombres propios</b> llevan mayúscula, y las mayúsculas <b>conservan la tilde</b>.","r":"mayusculas"},{"a":"La ONU se fundó en 1945.","b":"La Onu se fundó en 1945.","y":"Las <b>siglas</b> se escriben enteras en mayúscula: ONU, OTAN, RAE.","r":"mayusculas"},{"a":"Tengo el carné de conducir caducado.","b":"Tengo el Carné de Conducir caducado.","y":"Los nombres comunes no llevan mayúscula por «importancia»: <i>carné de conducir</i>.","r":"mayusculas"},{"a":"Vivo en la calle Mayor, número 5.","b":"Vivo en la Calle Mayor, número 5.","y":"<i>Calle</i> es un nombre común y va en minúscula; <i>Mayor</i> es parte del nombre propio con mayúscula.","r":"mayusculas"},{"a":"Estamos en el siglo XXI.","b":"Estamos en el Siglo XXI.","y":"Los <b>siglos</b> se escriben con minúscula: <i>siglo XXI</i>.","r":"mayusculas"},{"a":"Cervantes murió en 1616.","b":"cervantes murió en 1616.","y":"Los apellidos y nombres propios llevan mayúscula.","r":"mayusculas"},{"a":"Ayer vi una película de Almodóvar.","b":"Ayer vi una película de almodóvar.","y":"Los nombres propios de persona, con mayúscula.","r":"mayusculas"},{"a":"Estudio en la Universidad de Salamanca.","b":"Estudio en la universidad de Salamanca.","y":"Si <i>Universidad de Salamanca</i> es el nombre propio del centro, va con mayúscula en <i>Universidad</i>.","r":"mayusculas"},{"a":"Es una empresa española.","b":"Es una empresa Española.","y":"El gentilicio va en minúscula.","r":"mayusculas"},{"a":"Aquí empieza el capítulo segundo.","b":"Aquí empieza el Capítulo Segundo.","y":"Los sustantivos comunes como <i>capítulo</i> van en minúscula.","r":"mayusculas"},{"a":"Hoy es viernes, 3 de mayo.","b":"Hoy es viernes, 3 de Mayo.","y":"<i>Mayo</i>, mes, en minúscula.","r":"mayusculas"},{"a":"La ONU aprobó la resolución.","b":"La Onu aprobó la resolución.","y":"Las siglas se escriben íntegramente en mayúscula, sin puntos intermedios.","r":"siglas"},{"a":"La O.N.U. aprobó la resolución.","b":"La ONU aprobó la resolución.","y":"Las siglas no llevan puntos: lo correcto es <b>ONU</b>, sin puntos.","r":"siglas"},{"a":"El IVA subió este año.","b":"El iva subió este año.","y":"Las siglas se escriben en mayúscula; el artículo se ajusta a la pronunciación de la sigla (<i>el IVA</i>, <i>la ONU</i>).","r":"siglas"},{"a":"Se inscribieron 1 500 personas.","b":"Se inscribieron 1.500 personas.","y":"En español no se usa el punto ni la coma para separar millares: se deja un espacio fino (1 500).","r":"siglas"},{"a":"El acto será el 3 de mayo de 2024.","b":"El acto será el 3 de Mayo de 2024.","y":"El mes va en minúscula.","r":"siglas"},{"a":"La reunión es a las 18:30.","b":"La reunión es a las 18.30h.","y":"Las horas admiten <i>18:30</i> o <i>18.30 h</i>, con espacio antes de la h y siempre con los minutos.","r":"siglas"},{"a":"Llegó a las 9 h.","b":"Llegó a las 9h.","y":"Entre la cifra y el símbolo <i>h</i> se deja un espacio: 9 h.","r":"siglas"},{"a":"Vive en el número 14, 3.º B.","b":"Vive en el número 14, 3º B.","y":"Los <b>ordinales abreviados</b> llevan punto: 1.º, 2.ª, 3.º.","r":"siglas"},{"a":"Firmaron el tratado en EE. UU.","b":"Firmaron el tratado en EEUU.","y":"Las abreviaturas que resultan de reducir varias palabras llevan punto y espacio en cada elemento: <b>EE. UU.</b>","r":"siglas"},{"a":"Compró manzanas, peras, etc.","b":"Compró manzanas, peras etc.","y":"La abreviatura <i>etc.</i> lleva punto y va precedida de coma si cierra una enumeración.","r":"siglas"},{"a":"La RAE publicó la obra.","b":"La R.A.E. publicó la obra.","y":"Siglas sin puntos.","r":"siglas"},{"a":"Nació en 1990.","b":"Nació en 1.990.","y":"Los años de cuatro cifras se escriben sin separador de millares.","r":"siglas"},{"a":"El 20 % de los alumnos faltó.","b":"El 20% de los alumnos faltó.","y":"Entre la cifra y el signo <b>%</b> se deja un espacio: 20 %.","r":"siglas"},{"a":"Pesaba 70 kg.","b":"Pesaba 70 Kg.","y":"Los símbolos de unidades se escriben en minúscula y sin punto: kg, km, m, g. La excepción es el litro (l o L).","r":"siglas"},{"a":"Pienso que vendrá mañana.","b":"Pienso de que vendrá mañana.","y":"<b>Dequeísmo</b>: el verbo <i>pensar</i> no rige la preposición <i>de</i>. Prueba: «¿qué piensas?» → «que vendrá», no «de que vendrá».","r":"gramatica"},{"a":"Me alegro de que hayas venido.","b":"Me alegro que hayas venido.","y":"<b>Queísmo</b>: el verbo <i>alegrarse</i> sí rige <i>de</i>. Prueba: «¿de qué te alegras?» → «de que hayas venido».","r":"gramatica"},{"a":"Insistió en que no era necesario.","b":"Insistió que no era necesario.","y":"<i>Insistir</i> rige <i>en</i>: insistir <b>en que</b>. Omitir la preposición es queísmo.","r":"gramatica"},{"a":"Ha habido muchos problemas.","b":"Han habido muchos problemas.","y":"El verbo <i>haber</i> impersonal va siempre en <b>singular</b>: ha habido, había, habrá. No concuerda con su complemento.","r":"gramatica"},{"a":"Había muchas personas en la sala.","b":"Habían muchas personas en la sala.","y":"Con valor impersonal, <i>haber</i> no concuerda: <b>había</b> muchas personas. Es un error muy extendido, pero error en la norma culta.","r":"gramatica"},{"a":"Lo vi en el mercado.","b":"Le vi en el mercado.","y":"El objeto directo masculino de persona pide <i>lo</i> en la norma general. El uso de <i>le</i> (<b>leísmo</b>) está aceptado en algunas zonas, pero en un examen se espera <i>lo</i>.","r":"gramatica"},{"a":"Se lo dije ayer.","b":"Se le dije ayer.","y":"Cuando el objeto indirecto (<i>le</i>) se combina con el directo, se convierte en <b>se</b>: <i>se lo dije</i>.","r":"gramatica"},{"a":"Dijeron que llegarían tarde.","b":"Dijieron que llegarían tarde.","y":"El pretérito de <i>decir</i> es irregular: dije, dijiste, dijo, <b>dijeron</b>.","r":"gramatica"},{"a":"Satisfizo todas las expectativas.","b":"Satisfació todas las expectativas.","y":"<i>Satisfacer</i> sigue el modelo de <i>hacer</i>: hizo, deshizo, <b>satisfizo</b>.","r":"gramatica"},{"a":"Espero que hayas terminado.","b":"Espero que haiga terminado.","y":"<i>Haiga</i> no existe en la norma: el subjuntivo de <i>haber</i> es <b>haya</b>.","r":"gramatica"},{"a":"¿Tú viniste ayer?","b":"¿Tú vinistes ayer?","y":"La segunda persona del singular del pretérito es <b>viniste</b>, sin -s final: viniste, dijiste, hiciste.","r":"gramatica"},{"a":"Ayer anduviste mucho.","b":"Ayer andastes mucho.","y":"El pretérito de <i>andar</i> es <b>anduviste</b>: anduve, anduviste, anduvo.","r":"gramatica"},{"a":"Prevé que lloverá.","b":"Prevee que lloverá.","y":"<i>Prever</i> se conjuga como <i>ver</i>: previó, previendo, <b>prevé</b>, sin doble e.","r":"gramatica"},{"a":"Se trata de un problema grave.","b":"Se trata de que es un problema grave.","y":"La construcción <i>se trata de</i> + sustantivo es la correcta cuando se identifica algo; el «de que» solo cuando sigue una oración con verbo.","r":"gramatica"},{"a":"Hay que tener en cuenta que…","b":"Hay que tener en cuenta de que…","y":"<i>Tener en cuenta</i> no rige <i>de</i>: <i>tener en cuenta que</i>.","r":"gramatica"},{"a":"No me di cuenta de que faltaba.","b":"No me di cuenta que faltaba.","y":"<i>Darse cuenta</i> rige <i>de</i>: darse cuenta <b>de que</b>.","r":"gramatica"},{"a":"Le pedí que viniera.","b":"Le pedí de que viniera.","y":"<i>Pedir</i> no rige <i>de</i> cuando introduce una oración: pedir <b>que</b>.","r":"gramatica"},{"a":"A pesar de que llovía, salimos.","b":"A pesar que llovía, salimos.","y":"La locución completa es <b>a pesar de que</b>: no se puede suprimir la preposición.","r":"gramatica"},{"a":"Hace dos años que vivo aquí.","b":"Hacen dos años que vivo aquí.","y":"En las expresiones de tiempo, <i>hacer</i> es impersonal y va en singular: <b>hace</b> dos años.","r":"gramatica"},{"a":"Es más alto que yo.","b":"Es más alto que mí.","y":"Tras <i>que</i> en comparación se usa el sujeto: <i>que yo</i>. El pronombre <i>mí</i> solo tras preposición.","r":"gramatica"},{"a":"Entre tú y yo lo resolvimos.","b":"Entre tú y mí lo resolvimos.","y":"En la función de sujeto se usa <i>yo</i>, no <i>mí</i>.","r":"gramatica"},{"a":"Se prohíbe fumar en el interior.","b":"Se prohíbe de fumar en el interior.","y":"<i>Prohibir</i> no rige <i>de</i> delante de un infinitivo: prohibir fumar.","r":"gramatica"}]}
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   Lengua sin dudas — motor de la aplicación
   ═══════════════════════════════════════════════════════════ */
(function(){
"use strict";

const DATA = JSON.parse(document.getElementById("datos").textContent);
const THEORY = DATA.t;
const CAT = [["acento","Acentuación"],["orto","Ortografía"],["norma","Norma y estilo"]];
const CATNAME = Object.fromEntries(CAT);
const SEC = Object.fromEntries(THEORY.map(s => [s.id, s]));

const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]];} return a; }
const pick = (a,n) => shuffle(a).slice(0,n);
const LETTERS = ["A","B","C","D","E"];

/* ── almacenamiento ─────────────────────────────────────── */
const KEY = "lsd.v1";
let store = { seen:{}, stats:{}, runs:0, recent:[] };
try { const raw = localStorage.getItem(KEY); if(raw) store = Object.assign(store, JSON.parse(raw)); } catch(e){}
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }, 250); }
const seenIds = () => Object.keys(store.seen);
function markSeen(id){ store.seen[id] = Date.now(); store.recent.push(id); if(store.recent.length>400) store.recent=store.recent.slice(-400);
  const keys=Object.keys(store.seen); if(keys.length>9000){ keys.sort((a,b)=>store.seen[a]-store.seen[b]).slice(0,2000).forEach(k=>delete store.seen[k]); } save(); }

/* ── catálogo de preguntas ──────────────────────────────── */
const ACC_TYPES = ["aguda","llana","esdrújula","sobresdrújula","monosílaba"];

function accSection(t){
  if(t==="aguda") return "agudas";
  if(t==="llana") return "llanas";
  if(t==="esdrújula"||t==="sobresdrújula") return "esdrujulas";
  return "mono";
}
function finLabel(f){
  return {vocal:"una vocal", ns:"-n o -s precedidas de vocal", cons:"una consonante distinta de -n o -s",
          grupo:"un grupo de consonantes", y:"la letra -y"}[f] || "esa terminación";
}
function ruleFor(w){
  const shown = `<b>«${esc(w.w)}»</b>`;
  if(w.h){
    return `${shown} contiene un <b>hiato</b>: las vocales se pronuncian en sílabas distintas, y la tilde cae sobre la vocal cerrada tónica aunque la regla general no la pediría. La <i>h</i> intercalada no cambia nada.`;
  }
  if(w.t==="monosílaba"){
    return `${shown} es una palabra <b>monosílaba</b>: las de una sola sílaba no llevan tilde. La única excepción es la <b>tilde diacrítica</b> (<i>tú / tu</i>, <i>sí / si</i>).`;
  }
  if(w.t==="esdrújula"){
    return `${shown} es <b>esdrújula</b> (la tónica está en la antepenúltima sílaba) y las esdrújulas <b>se tildan siempre</b>, sin mirar la terminación.`;
  }
  if(w.t==="sobresdrújula"){
    return `${shown} es <b>sobresdrújula</b> (la tónica va antes de la antepenúltima) y las sobresdrújulas <b>se tildan siempre</b>.`;
  }
  if(w.t==="aguda"){
    const si = (w.f==="vocal"||w.f==="ns");
    return `${shown} es <b>aguda</b> (tónica en la última sílaba) y termina en ${finLabel(w.f)}. Las agudas llevan tilde <b>${si?"sí":"no"}</b> en ese caso: solo se tildan las que acaban en vocal, <i>-n</i> o <i>-s</i>.`;
  }
  const si = (w.f==="cons"||w.f==="grupo"||w.f==="y");
  return `${shown} es <b>llana</b> (tónica en la penúltima sílaba) y termina en ${finLabel(w.f)}. Las llanas llevan tilde <b>${si?"sí":"no"}</b> en ese caso: se tildan cuando <b>no</b> acaban en vocal, <i>-n</i> o <i>-s</i>.`;
}

const CATALOG = [];
function reg(id, cat, ref, mk){ CATALOG.push({ id, cat, ref, mk }); }

/* A. acentuación: tipo + forma correcta */
DATA.ac.forEach((w,i)=>{
  reg("ac"+i+"t","acento", accSection(w.t), ()=>qType(w));
  reg("ac"+i+"f","acento", w.h? "hiato" : accSection(w.t), ()=>qForm(w));
});
/* B. reglas de acentuación (pregunta de norma) */
const RULE_STATEMENTS = [
  "Sí: las agudas se tildan cuando terminan en vocal, en -n o en -s.",
  "No: las agudas no se tildan cuando terminan en vocal, en -n o en -s.",
  "Sí: las llanas se tildan cuando NO terminan en vocal, en -n o en -s.",
  "No: las llanas no se tildan cuando terminan en vocal, en -n o en -s.",
  "Sí: siempre, sin excepciones.",
  "No: nunca llevan tilde."
];
function qRule(tipo, fin){
  let correct;
  if(tipo==="aguda") correct = (fin==="vocal"||fin==="ns") ? RULE_STATEMENTS[0] : RULE_STATEMENTS[1];
  else if(tipo==="llana") correct = (fin==="cons"||fin==="grupo"||fin==="y") ? RULE_STATEMENTS[2] : RULE_STATEMENTS[3];
  else correct = RULE_STATEMENTS[4];
  const opts = shuffle([correct, ...pick(RULE_STATEMENTS.filter(s=>s!==correct), 3)]);
  const ex = DATA.ac.filter(w=>!w.h && w.t===tipo && w.f===fin).map(w=>w.w);
  const kind = tipo==="monosílaba" ? "una palabra monosílaba" : `una palabra ${tipo}`;
  return {
    cat:"acento", ref: accSection(tipo),
    tag:"Regla de acentuación",
    prompt:`${kind[0].toUpperCase()+kind.slice(1)} que termina en ${finLabel(fin)}. ¿Lleva tilde?`,
    options: opts.map(s=>({label:s, kind:"sent"})),
    correct: opts.indexOf(correct),
    why: correct + (ex.length ? ` Ejemplos que lo comprueban: <i>${pick(ex, Math.min(3,ex.length)).join("</i>, <i>")}</i>.` : ".")
  };
}
[["aguda","vocal"],["aguda","ns"],["aguda","cons"],["aguda","grupo"],["aguda","y"],
 ["llana","vocal"],["llana","ns"],["llana","cons"],["llana","grupo"],["llana","y"],
 ["esdrújula","vocal"],["llana","cons"]].forEach((p,i)=>{
  if(i===11) return;
  reg("rg"+i,"acento","silaba", ()=>qRule(p[0],p[1]));
});
reg("rgm","acento","mono", ()=>qRule("monosílaba","cons"));

/* C. ortografía: pares confundibles, 3 variantes de pregunta */
DATA.ort.forEach((o,i)=>{
  const errs = o.e.length ? o.e : o.pool;
  const k = Math.min(3, Math.max(1, errs.length));
  for(let j=0;j<k;j++){
    const chosen = errs.length===1 ? errs : [errs[j % errs.length], errs[(j+1)%errs.length]].filter((v,idx,a)=>a.indexOf(v)===idx);
    reg("or"+i+"_"+j,"orto", o.r, ()=>qOrt(o, j));
  }
});
/* D. diacríticos, homófonos y oraciones */
DATA.diac.forEach((d,i)=>reg("di"+i,"acento","diacritica",()=>qGap(d,"Tilde diacrítica")));
DATA.hom.forEach((d,i)=>reg("ho"+i,"acento","gramatica",()=>qGap(d,"Palabras que se confunden")));
DATA.or.forEach((o,i)=>reg("se"+i,"norma",o.r,()=>qSent(o)));

/* ── constructores de pregunta ──────────────────────────── */
function qType(w){
  const opts = ACC_TYPES.slice();
  return {
    cat:"acento", ref: accSection(w.t),
    tag:"Clasifica la palabra",
    prompt:`¿Qué tipo de palabra es <span class="q-word">${esc(w.w)}</span> según la posición de su sílaba tónica?`,
    options: opts.map(s=>({label:s})),
    correct: opts.indexOf(w.t),
    why: ruleFor(w)
  };
}
function qForm(w){
  const variants = w.v.slice();
  const n = Math.min(variants.length, 3);
  const wrong = pick(variants, n);
  const opts = shuffle([w.w, ...wrong]);
  return {
    cat:"acento", ref: w.h? "hiato" : accSection(w.t),
    tag:"Elige la forma correcta",
    prompt:`Solo una de estas formas está bien escrita. ¿Cuál?`,
    options: opts.map(s=>({label:s, kind:"word"})),
    correct: opts.indexOf(w.w),
    why: ruleFor(w)
  };
}
function maskOf(correct, errors){
  const a=[...correct], mask=new Set();
  errors.forEach(e=>{ const b=[...e]; for(let i=0;i<Math.max(a.length,b.length);i++){ if(a[i]!==b[i]) mask.add(i); } });
  if(!mask.size) mask.add(Math.max(0,a.length-1));
  return a.map((c,i)=> mask.has(i) ? `<span class="mask">_</span>` : esc(c)).join("");
}
function qOrt(o, j){
  const errs = o.e.length ? o.e : o.pool;
  let wrong;
  if(errs.length===1) wrong=[errs[0]];
  else { wrong = [errs[j%errs.length], errs[(j+1)%errs.length]].filter((v,i,a)=>a.indexOf(v)===i); }
  const opts = shuffle([o.w, ...wrong]);
  return {
    cat:"orto", ref:o.r,
    tag: o.n,
    prompt:`Se ha ocultado la parte dudosa. ¿Cómo se escribe?`,
    display: `<div class="maskline">${maskOf(o.w, wrong)}</div>`,
    options: opts.map(s=>({label:s, kind:"word"})),
    correct: opts.indexOf(o.w),
    why: `<b>${esc(o.w)}</b> es la forma correcta. ${o.y}`
  };
}
function qGap(d, tag){
  const opts = d.o.slice();
  const parts = d.p.split("___");
  return {
    cat:"acento", ref:"diacritica",
    tag: tag,
    prompt: parts.map((p,i)=> esc(p) + (i<parts.length-1 ? `<span class="blank"></span>` : "")).join(""),
    options: opts.map(s=>({label:s, kind:"word"})),
    correct: d.k,
    why: d.y
  };
}
function qSent(o){
  const opts = shuffle([o.a, o.b]);
  return {
    cat:"norma", ref:o.r,
    tag:"Detecta la opción correcta",
    prompt:`De estas dos, solo una sigue la norma. ¿Cuál escribirías en un texto cuidado?`,
    options: opts.map(s=>({label:s, kind:"sent"})),
    correct: opts.indexOf(o.a),
    why: o.y
  };
}

/* ── ejecución de una tanda ─────────────────────────────── */
const run = { deck:[], i:0, answers:[], mode:{}, locked:false };

function buildDeck({cat, ref, n}){
  let pool = CATALOG.filter(d => (!cat || d.cat===cat) && (!ref || d.ref===ref));
  if(!pool.length) pool = CATALOG.slice();
  const fresh = shuffle(pool.filter(d=>!store.seen[d.id]));
  const used  = shuffle(pool.filter(d=>store.seen[d.id]));
  const near  = new Set(store.recent.slice(-60));
  const usedFar = used.filter(d=>!near.has(d.id)).concat(used.filter(d=>near.has(d.id)));
  let sel = fresh.slice(0, n);
  if(sel.length < n) sel = sel.concat(usedFar.slice(0, n-sel.length));
  return shuffle(sel).slice(0, n);
}

function startRun(mode){
  run.deck = buildDeck(mode);
  if(!run.deck.length){ toast("No hay preguntas en ese bloque."); return; }
  run.i = 0; run.answers = []; run.mode = mode; run.locked = false;
  go("#/test/sesion");
  renderQ();
}

  const pct = answered? Math.round(correct/answered*100) : 0;
  const seenN = seenIds().length;
  const rows = refs.map(r=>{
    const s = stats[r], p = Math.round(s.c/s.a*100);
    return { ref:r, a:s.a, p, title: SEC[r]? SEC[r].title : r, group: SEC[r]? SEC[r].group : "—" };
  }).sort((a,b)=> b.a-a.a);
  const weak = rows.filter(r=>r.a>=3).sort((a,b)=>a.p-b.p).slice(0,5);
  app.innerHTML = `
  <div class="sect" style="margin-top:0"><h2>Seguimiento</h2><span>guardado en este navegador</span></div>
  <div class="metric">
    <div class="card"><span class="num">Respondidas</span><h3 style="font-size:1.7rem">${answered}</h3><p>${store.runs||0} tandas completadas</p></div>
    <div class="card"><span class="num">Aciertos</span><h3 style="font-size:1.7rem">${answered? pct+"%" : "—"}</h3><p>${correct} correctas de ${answered}</p></div>
    <div class="card"><span class="num">Preguntas distintas vistas</span><h3 style="font-size:1.7rem">${seenN}</h3><p>de ${CATALOG.length.toLocaleString("es-ES")} del banco</p></div>
  </div>
  <div class="sect"><h2>Acierto por apartado</h2><span>${rows.length} apartados practicados</span></div>
  ${rows.length? `<div class="panel"><div class="bars">${rows.map(r=>`
      <div class="bar-row">
        <span><a href="#/teoria/${r.ref}">${esc(r.title)}</a></span>
        <span class="bar-track"><i class="${r.p<50?"low":r.p<75?"mid":""}" style="width:${r.p}%"></i></span>
        <span class="pct">${r.p}% <span style="color:var(--ink-3)">(${r.a})</span></span>
      </div>`).join("")}</div></div>`
    : `<div class="empty">Todavía no hay datos. Empieza una tanda de diez preguntas y aquí aparecerá tu mapa de puntos fuertes y débiles.</div>`}
  ${weak.length? `<div class="sect"><h2>Lo que conviene releer</h2><span>por índice de fallo</span></div>
    <div class="panel"><div class="weak-list">${weak.map(r=>`
      <div class="weak-item"><span class="wl"><a href="#/teoria/${r.ref}">${esc(r.title)}</a> <span style="color:var(--ink-3)">· ${esc(r.group)}</span></span>
      <span class="wp">${r.p}% acierto</span>
      <a class="btn sm ghost" href="#/test/tema/${r.ref}">Practicar</a></div>`).join("")}</div></div>`:""}
  <div class="cta-row" style="margin-top:1.6rem">
    <a class="btn primary" href="#/test">Nueva tanda</a>
    <button class="btn ghost" id="reset">Borrar mi progreso</button>
  </div>`;
  $("#reset").addEventListener("click", ()=>{
    if(confirm("Se borrarán las estadísticas y la memoria de preguntas vistas. ¿Continuar?")){
      store = { seen:{}, stats:{}, runs:0, recent:[] }; save(); toast("Progreso borrado"); setTimeout(()=>route(), 400);
    }
  });
}

  app.innerHTML = `

    <div class="card"><span class="num">02</span><h3>Practica ese apartado</h3><p>El botón «Practicar este apartado» lanza preguntas solo de esa regla, para fijarla antes de mezclar.</p></div>

/* ── teclado y utilidades ───────────────────────────────── */
document.addEventListener("keydown", e=>{
  if(e.target.matches("input, textarea, select")) return;
  const opts = $$("#opts .opt");
  if(opts.length && !run.locked && /^[1-9]$/.test(e.key)){
    const k = +e.key - 1; if(k < opts.length) answer(k);
  } else if(e.key === "Enter" && run.locked){ nextQ(); }
});
let toastTimer;
function toast(msg){
  let t = $("#toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
$("#theme").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme")==="dark" ? "light":"dark";
  document.documentElement.setAttribute("data-theme", cur);
  try{ localStorage.setItem("lsd.theme", cur); }catch(e){}
  $("#theme").setAttribute("aria-label", cur==="dark"? "Cambiar a tema claro":"Cambiar a tema oscuro");
});
try{ const th = localStorage.getItem("lsd.theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}

/* arranque */
route();
})();
